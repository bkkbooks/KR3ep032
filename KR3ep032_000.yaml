front:
  text: 序余讀鄭素圃先生醫案而深嘆先生仁育之功之大也先生體驗深故見之獨確閲歷久故信而有徵具卓然之識而能好學深思心知其意故其視人病不啻見垣一方苟非司命無奈之何先生莫不使之霍然而起今年已老不忍沒其生平之苦心全活之實效舉其尤大彰明較著者筆為醫案斯真足以信今傳後而垂無窮吾聞先生之於醫非偶然也先生早年痛其尊公先生即世自傷為人子而不知醫旋又自膺疢疾復苦醫之多不精脈不達陽生陰長之故苟非大相乖舛即同胡廣之中庸味道之模稜遂致宛轉於藥爐間者凡五年用是憂愁發憤恣意搜討上自軒岐下迄近代不遺餘力一旦確然有以會其指歸夫五年之久切身之火其間四時之更迭七情之感觸標本虛實藏府傳變方劑損益無不飲食寐寐甘苦親嘗始悟醫之互相沿習多事虛聲而古先聖人醫之源本方之準繩欲求神明變化於其間固非倣佛襲取之所能得也夫醫之為書汗牛矣窮年涉獵而無當於治雖多亦奚以為今縫掖之儒無論帖括稿本匝地彌天即自謂羽經翼傳著述衰然求其接孔孟心傳千百中無有也苟能體之身心驗之實踐則求之六經四子而有餘先生之於醫亦若是而已矣靈經素難先生之六經也仲景東垣則先生之濂洛也本身徵民先生之道其庶幾乎吾觀醫案之中憑脈者十之八九三指不明誤人七尺先生之脈精矣參之望聞者勿論則隔幃不出一語而能決其為幽陰之隱疾也意得者十之一二醫者意也先生之意神矣則觀市中之多抵魚而能知其中毒見幾上之葡萄乾而能知其舌之非不可治也如此者不能臚舉要皆他醫斂手莫措而先生迎刃奏功則先生之醫案其可不流傳以示後世哉且醫案不可與醫方同日語也先是先生之曾祖夢圃公有墨寶齋經驗方焦弱侯太史公序而行世聞有祕方不憚數千里購之雖重資勿恤兵燹之後板多散佚先生重修而廣布之然方雖良必視乎證苟證之疑似介乎毫芒則猶恐不免於泥古談兵按圖索驥案則詳於證而方具焉如法家之成案供其事之始末而判其尾又如禪家之公案舉其語之觸背而透其宗後之留心於此者取而例之而參之其通變不尤足多乎哉或疑先生醫案中多著他家之誤何也曰是先生之仁也先生悃愊無華非若李士材之工於排俗而於醫之誤者必備載之世之病而死者半醫而死者亦半徒避彰短炫長之小嫌而使後之誤者踵其誤是聽人之相藉以死先生不忍為也且諱其人而第著其誤何傷乎故曰仁也或疑先生醫案中偏於溫補何也曰非偏也亦先生之仁也吾聞陽道舒陰道肅故乾統乎坤卦晝於一陽所以生生不已之元也萬物體陰而用陽二氣屈陰而伸陽聖人賤陰而貴陽人之身陽不盡則不死陰不盛則不病而道家謂陰盡而後仙此其旨惟先生明之故醫案所載得薑桂而起者為多夫過於辛溫投以清涼即解一失於苦寒而頓殞者比比也且先生非膠柱而鼓者也故曰亦先生之仁也先生仁被斯人之功大矣哉彪不敏時有采薪唯先生託命焉會先生卷帙有成一二同志將壽諸梨棗因踴躍以襄不朽但愧言之少文又無能窺見間奧以當年侍先君子時時與聞導引得諸過庭之言今讀是書觸緒而有合也故不揣而序之如此時康熙丙戌夏五月小暑日同里後學許彪又米甫拜撰醫案自序夫人身命之所繫陰與陽而已陰陽和而生意遂焉偏勝則害湯液所以救其偏而和之也是故藥之為性不寒則溫不升則降不補則泄不瀉則澀而自軒岐以來聖神輩出悉皆兼收並蓄待用無遺而曾不敢為晝一之規使去溫取寒存補廢泄者凡欲以藥性之偏救人氣血之所偏也自朱丹溪殿於張劉李三家之後成一家之言而為之説引日月之盈虧以喻陽常有餘陰常不足遂印定後人耳目專事苦寒以伐真陽嗚呼夫人身氣血之所偏而率皆陽盛而陰虛也丹溪之治亦無誤焉不然真陽既虧而復甚之苦寒以伐之其亦不仁甚矣經曰陰平陽祕精神乃治又曰陰陽離決精氣乃絶夫曰平則不欲過盛可知曰祕則當寶護可知曰離決乃絶則陰精不獨絶可知陽氣亦離決可知然則聖言具在司民命者且必專事苦寒以伐真陽也耶張介賓有言劉朱之論不息軒岐之澤不彰辭雖過激用意良深不侫寄居蕪城凡三十年每當臨證施治輒不敢謬執成見而必消息詳審察氣血之所偏究病因之所極與其情之所欲得治既效則録其顛末以備參考案帙繁多茲簡其即用先聖成法與治合丹溪後人不盡眩惑之證束而度之獨摘其亢害疑似之證匯成四卷用示門人會又米且碩繡天諸君欲為捐資付之剞劂余曰溯醫學之源察陰陽之理軒岐奧典則具在矣各家闡發亦有可參胡區區乎膠固為然以尊內經之旨補專事苦寒之偏而於以和陰陽而遂生意則是編也或不無小補焉不揣固陋用質大方凡我同心幸為裁正康熙丁亥小暑後三日新安素圃老人鄭重光題於守一齋時年七十
