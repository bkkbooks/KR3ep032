body:
  text: 卷三諸中證治效方惟善翁年七十夏月忽右手足不用口眼喎斜舌強面赤脈虛大而參伍不調兩寸脈十數至一歇但止數不齊耳問其脈何以歇至彼云今十年矣每心一掣跳則脈必歇余曰心掣為腎病此心腎氣虛並無風邪六經形證溫經大補或可復原若作風醫必致屢廢遂用人參黃耆白朮桂枝芍藥附子天麻當歸等藥每日用參兩許醫治月餘口眼端正步履如常方在調理之餘忽發咳嗽彼自誤為痰火參附貽禍數日後目窠微腫頸脈大動尿如煤水乃腎藏真陽不足將成水蠱之證也隨即咳喘不能臥足趺先腫漸延兩腿余用金匱腎氣湯加倍桂附更入人參三錢時當酷暑懸大帳於庭伏枕於幾者二十八日藥近百劑小便漸多而腫消適因病後營葬勞煩調理失宜遂時發喘咳不能平臥至八旬乃終汪大扶兄年四十五善飲貪涼此素性也雪途昏僕於地抬歸始醒即遍身拘攣腰足冷痛手足不能舉已具六經形證此真中風也先醫者作虛治而用人參困頓於床後延余治脈弦而沉緊此夙昔之風加以雪天新中於寒兩邪併發致昏厥而僕風寒未解何用補為余以桂枝細辛羌活附子赤芍乾薑半夏甘草小續命湯加減溫里解表五六日邪氣外出脈略浮弦而增咳嗽再加麻黃杏仁續續得汗而痛減將一月身發癮疹作癢外解而痊吳敦吉翁年逾五十善飲多勞二月間盥洗時忽然發暈嘔痰未僕即右手足不舉言語蹇澀口眼不歪尚能扶步脈弦滑有力而無他證此痰中也用六君子湯去人參加膽星天麻秦艽竹瀝薑汁半月後病減方少加人參兼用歸芍一月後即言語步履如常矣趙智善因酒後憤爭隨即昏僕不語手足厥冷前醫用牛黃丸不效用風痰藥亦不效已經一日夜矣余視之六脈皆沉弦而歇至來去不亂喉無痰聲手足微冷口眼端正牙關半開呼吸調勻面無賊色蓋中風則身濕中氣則身冷此中氣也用皂角末吹鼻得嚏一聲隨嘆氣一口手有動意繼用烏藥順氣散加木香沉香微煎數沸緩緩灌下即噯氣一聲而蘇瓜鎮劉玉吾年六十外混堂浴歸卒中一日始醒初醫以風痰火雜洽風則羌防火則膏連痰則星夏繼進蘇合丸數枚則遺尿矣十日外始迎余治診其脈虛大無倫昏睡不語身重遺尿肢不偏廢口不歪斜喉無痰聲原非中風因老年貪浴汗多亡陽而暴脫有似中風失此不用補中反行疏導陽氣愈虛致遺尿不語竟成脫證急用歸脾湯原方入人參一錢四劑即能言語飲食惟尿不禁耳每日間用八味地黃湯去丹皮澤瀉加人參破故紙益智仁五味子而尿固數日後舌苔全黑而滑此中氣虛寒腎水凌心用苓桂理中湯四劑而苔退後仍以歸脾湯甘溫之劑調補一月方能步履但因多食蘇合丸辛香散氣病愈後言語隨忘欲言又止終不能復也鎮江巡江營王守戎之媳抱子登署後高樓樓逼山腳若有所見抱子急下即昏僕者一日夜薑湯灌醒如醉如癡默默不語不梳不洗與食則食弗與亦弗索也或坐或臥見人則避如此半月越江相招入其室即避門後開門即避於床面壁不欲見人令人抱持握手片刻而兩手脈或大或小或遲或數全無一定此中惡也與蘇合香丸拒不入口灌之亦不咽明系鬼祟所憑意惟秦承祖灸鬼法或可治也遂授以灸法用人抱持將病人兩手抱柱捆緊扎兩大指相連用大艾團一柱灸兩大指甲角灸至四壯作鬼語求食求冥資灸至七壯方號呼叫痛識人求解繼進安神煎劑熟睡數日而愈吳翰臣兄令眷豫族之女也清明夜門首看城隍會甫入堂忽昏僕於地不能言語抬上床一刻即大吐口出妄言謂城隍夫人需侍者已得三人令其入廟服役語畢仍閉目昏睡其家驚畏暮夜迎余自門首至寢所皆燒冥資觀其色無青黑鬼氣切其脈兩手相同至止不亂但虛大無力余詢其聲變否家人對以如常此殊不似中惡之證也又問前有病否家人云經水行有半月未止數日前即燃燈通夜不熄翰臣外出要人作伴似有畏惟之狀蓋邪之所湊其氣必虛因脫血心虛夜看城隍會見扮鬼形心布而神亂矣即或中惡亦因其虛也以人參五錢桂心一錢銀一錠煎熟灌下又將渣再煎灌下片刻即醒問其前事全然不知惟記門首看會不知何由在床但稱心慌手麻而已隨用歸脾湯數服經止病愈魏老者冬月自郡歸瓜鎮夜食畢方就枕即昏厥手足僵直而厥冷牙關咬緊面青脈沉此老年氣弱被嚴寒所迫寒中也先以濃薑湯抉齒灌入牙關略開繼以附子乾薑半夏甘草四逆湯大劑灌下至五鼓身方回溫人亦漸醒巴其臣主政令眷年未三十遭新喪悲鬱之後忽眩暈昏僕不語脈弦數而澀有時手抽掣面上發赤喉無痰聲藥亦能咽惟昏睡不語者三日夜矣經醫數人主風主痰主虛與以牛黃抱龍丸皆能咽但終不醒豫以脈弦數獨主火中蓋木鬱化火肝火暴甚故卒倒而無知也經云陰氣衰於下則為熱厥以滋肝清火逍遙散為主用歸芍丹皮柴胡鬱金梔子貝母羚羊角竹瀝頻灌一日夜回蘇能語而愈嗣後遇怒仍發吳坦如兄年將三十酒後行走忽昏僕不知人事扛上床一刻方醒即右手足不能舉尿不禁而口眼不歪舌微強時發寒而汗出小便頻下六脈細濡無力此元氣大虛類中風之脫證也若不急行溫補恐致大汗喘厥亡陽乃顯明易見之虛病時火治庵盛行之際亦不能別生他議遂以參耆歸朮桂附天麻半夏益智等藥補益月餘而健從容庵僧飽食後混堂洗浴昏暈抬歸手足溫暖呼吸調勻口眼端正牙關不緊又無痰聲其人氣實本無病者診其脈兩關沉滑有力惟閉目不語掐其人中亦知痛此證非風非痰非寒非虛以意度之飽食之後久浴傷氣胃中食滿氣虛不能運轉經云一息不運則機緘窮豈非食中耶以手重按其胃口則眉皺手推遂用薑鹽湯探吐灌下即嘔噦吐出未化之飯半盆噯喲一聲目開而醒矣揚州大守如夫人年及三十平素虛弱參朮湯丸不輟盛暑忽身疼發熱嘔吐痰水猶以平日之虛召用補劑及診其脈浮弦而細對以非平常之虛乃暑熱傷氣復受風邪暑風證也須先治風以葛根藿香二陳砂仁厚朴生薑一劑即汗出發熱身痛皆愈少刻手足攣搐目珠上視喘喝遺尿身僵不語矣署中驚畏急復再召脈則不浮但弦細耳神昏僵臥但能咽藥因脈之細乃氣虛傷暑而卒中也面垢遺尿皆屬暑病而非脫證用古方消暑丸三錢溫胃滌痰服藥時許又得微汗即目開能語續以香砂六君子湯二劑而愈男病治效汪嵩如翁己未年維揚患病隨余迪茲至瓜鎮就彼治療寓江干從容僧舍因藥未效又問治於余晝夜不寐者已月餘矣診其脈虛大而數重按豁然日惟食清粥兩三盂而已時當仲秋下旬衣單紗猶畏熱之至令僕揮扇方可伏枕否則起行不能著席矣先醫用藥祕不令知但云日服人參而已審其病因始於憤怒兼恐而致病余即病因合病之狀而議治焉蓋暴怒傷陰則肝氣逆恐傷腎則氣下腎水不升心陽不降腎肝兩病魂不歸肝氣不歸腎因衛氣常留於陽則陽蹺盛不得入於陽則陰虛故目不瞑矣真陽外越脈虛大而不斂天令雖涼而猶畏熱似與陰盛格陽同病又非真武四逆所能治也經曰陰者陽之守也陽者陰之衛也病始於暴怒傷陰陰不守陽孤陽飛越寒之不寒是無水也用從陰引陽法以八味地黃湯倍用桂附加人參四劑病知八劑得寐半夜十日後即熟寐矣病痊心感勸余遷揚代為稅居逾年之後因移寓郡城矣熊偉男司訓正月上旬賀節飲酒即於席上腹痛吐瀉並作厥冷大汗竟不能歸先醫用炮薑香砂不效又進平胃二陳亦不效因吐瀉大汗真陽外越反面赤脈大腹脹而痛延京口名家見其腹大而痛視為實證投以木香檳榔腹皮破氣劫藥病家不敢服自真州迎余至瓜鎮已病四日矣診其脈洪大無倫重取即散素有肋下肝腎氣病自以為舊疾作楚豫曰非也蓋首春苦冷暴寒所傷此寒霍亂也故卒然大痛吐瀉並作因吐瀉汗出裡氣虛寒真陽外越以致面赤戴陽陰躁不眠口乾嘔噦腹脹如石脅痛氣衝脈洪散亂此汗瀉亡陽大虛若實危篤急證若不急救必致厥冷汗出不治矣非若尋常霍亂吐瀉止而愈者比也遵仲景霍亂治法以四逆湯加人參肉桂茯苓小劑先投得閉目片刻繼用人參五錢附子三錢乾薑肉桂茯苓各二錢日投三劑脹略斂小而兩足太溪衝陽皆陷下不見如斯重劑六日始脹痛止而得臥十二日大便方通可進飲食因平素臍旁腎藏有動氣耆朮皆不能入劑用四逆桂苓二十餘日飲食始餐易用八味地黃湯三倍桂附加人參調治兩月方健其時瓜鎮醫家僉云誤補必致危殆因令子青選為豫門人不得不肩任也吳敦吉翁年逾五十己未年大旱河水乾涸鹽運維艱因此思慮過度遂倦怠懶言默默獨坐不欲見人然神思內清有問必答並非昏憒乃情志之病也醫有以痰治者有以育神養心治者豫亦參治其間皆不效漸致終日昏睡不起將黃昏則自起盥洗食粥夜分食飲五鼓飲酒與侍者如常談笑將天明則脫衣而臥日間強扶掖而起終不肯坐如斯年餘絶不服藥藥亦不效豫曰雖陽虛之嗜臥實思慮之傷脾因七情致病須情志以勝之非藥可治如華陀之治魏守激其大怒可霍然而起此因思致病須怒以勝之其時以余言為虞乃未幾有人隔屏憤爭觸其大怒披衣而起與彼辨論大聲疾呼次日天明即霍然而起矣隔數日步行枉謝余問曰去年令公郎激翁怒猶記憶否答以其時欲怒而不能也嗣後則動履竟復舊矣李元亮書吏也因書寫過勞秋杪忽咳嗽火上逆頭面皆赤前醫苦寒直折隨吐粉紅白血如肺肉則火愈上逆一日三五次火一逆則遍身皆赤咳嗽益甚間有白血頭面汗多余往診之兩手脈大而數重取全無神力若以失血之後見此數大之脈則為逆證咳白血亦屬不治病者云臥則不咳坐起則咳甚余熟思之久視傷血書寫傷力此氣中虛火宜人參黃耆甘草以退之所謂虛火宜補誤用苦寒虛以實治則火愈熾坐起咳甚肺虛也脈大無力所謂勞則彰亦氣虛也多汗面赤乃虛陽上泛非陰虛之火遂用大劑黃耆為君人參當歸白芍麥冬五味甘草為臣佐一劑汗收脈斂三劑火息咳止如此滋補一月方能起床火之陰陽可不辨哉萬守澍文學尊翁年七旬外長齋獨宿二十年矣因心事怫鬱夜中忽大吐紫血碗許隨腹痛又便紫黑血碗許昏僕於地室內無人及其自醒始登榻次日相招兩手脈大而芤幸不散耳他醫議用涼血滋陰豫曰非也此畜血證因鬱怒傷肝脾肝不藏血脾不裹血致血無歸而成瘀敗上吐下便幸老翁閉關已久不致氣隨血脫尚敢滋陰以傷胃脘之陽乎用大劑歸脾湯加炒黑乾薑計用人參數兩匝月乃康曹君儀年六十四體半肥素陰虛初病脅痛嘔吐寒熱汗出胸中噎塞將成膈證豫以歸芍川芎二陳香附鬱金等藥治之半年胸中寬遂咳嗽吐痰轉為虛勞每因勞則寒熱似瘧汗出熱退身目皆黃溺赤又變為疸證用逍遙散數劑其黃即退或一月一發半月一發漸至面額黧黑爪甲枯粉大便祕澀此女勞疸又名黑疸也一醫以疸不必分五均是濕熱用平胃五苓間用黃連肉桂病愈篤僅存皮骨已備終事復求治於余但女勞疸一證仲景言之甚詳必有寒熱久為黑疸皆主風藥東垣因之亦以風藥而加參朮用皆不效夫女勞之名必屬腎水虧虛水虛則土實所以反見敦阜之色此虛邪也不必平土但宜壯水水壯則土不燥虞天民蒼生司命云女勞疸當作虛勞治之正合治法遂以六味地黃湯加當歸芍藥秦艽苡仁麥冬養陰壯水之藥百劑寒熱先除疸黃漸退至七旬外他疾而終王君聖翁前瘧證愈後而經營勞碌過甚自恃強壯不善愛護每遇過勞或飲食不節便發寒戰戰後發熱腹脅大痛或瀉或不瀉汗出熱退身目俱黃腹大如鼓因前治瘧知其腎藏虛寒以八味地黃料加倍桂附水疊為丸日服不輟病發則用逍遙散加秦艽丹皮數劑即退如斯三四年應酬如故後年逾六十正氣漸衰發頻而黃不退額黃漸黑竟成女勞疸矣其時火治庵名噪甚遂易彼治之謂疸不必分五皆以濕熱冶之重用茵陳為君雜以五苓平胃治經二三年治庵自病又易醫亦以濕熱治之時重時輕人則骨立腹則脹大年將望七忽頭大痛此腎厥頭痛而醫者不行溫補反作風治用桂枝細辛白芒疏風散氣之劑遂致三日而逝前曹疸證腎藏虛熱陽黃也此疸證腎藏虛寒陰黃也均屬女勞疸證豈可疸不必分五混同濕熱而治之乎程於宮兄首春自場來揚就醫面目皆黃胸腹飽脹腹痛便溏脈沉而緊此太陰脾藏之陰黃色黃而黯非胃府之陽黃色如橘皮也言場服茵陳梔子四苓清熱之藥病將一月而不效此證本中寒誤作濕熱豈不益甚乎而病者素畏熱藥今病患中寒不得不溫先以蒼朮炮薑二陳砂仁茵陳澤瀉投之胸雖稍寬脈沉不起緊亦不退遂加附子易乾薑十數劑黃退腹消即前方蒼朮換白朮去茵陳加甘草調理而愈此疸病正治亦須辨陰陽寒熱也崔魏子病疝一月清肝理氣消堅攻劫無不備嘗最後招豫診其脈細濡如綿惟有三至羸瘦不堪色枯貌瘁臥床不起疝墜於囊全不知痛時值秋暑畏寒服綿豫曰虛寒極矣元氣下陷須溫而舉之用人參黃耆肉桂附子當歸升麻甘草薑棗為引溫腎升陽五七日疝方漸收能坐溫補而愈越三年又疝痛牽引胸背胃中亦隱隱而痛歷醫多人有疏肝者有理氣者有用安息諸香者漸至陽虛自汗驚悸不眠較前病更甚病兩月矣自慚不便請凂人求治診其脈細澀不堪乃氣血兩虧津枯髓減肝腎病也經曰諸陽受氣於胸中轉行干背此氣虛胸背痛也又經曰肝虛則令人胸痛引背下則兩脅胠滿此血虛之胸背痛也肝虛不藏魂故不寐氣虛不能衛故自汗脈又細澀此傷精亡血之證以熟地黃當歸枸杞山茱萸棗仁補腎滋肝以肉桂破故紙引氣歸腎加人參黃耆以益衛氣初服病知漸減多服尋愈兩月方瘳前醫執痛無補法豈定論乎王用明兄新正登金山日中痛飲攀緣山巔勞而汗出歸臥火箱夜又夢遺次日四肢清冷面慘不光肌膚似麻非麻似癢非癢惟皮外不欲沾衣覺衣之硬甚也夜臥被席亦如之脈浮而濡醫初用疏邪實表驅風劑不效豫曰此肉苛也雖正月猶屬冬令陽氣在裡勞而汗出則衛虛又值夢遺而營弱所以不勝衣而肉苛也以黃耆建中湯加白朮當歸薑棗為引三劑而愈熊闢疆兄秋間食冷物當風假寐次日即胸前結硬冷痛乾嘔作瀉隨服平胃二陳炮薑四劑稍減而未痊因循兩月服藥斷續其間或服薑桂溫中之劑則痛愈甚以手捫之胸皮皆冷嘔吐酸水小便澀少脈初診則細重按反滑而有力余曰初因寒中積之既久鬱而成熱所以薑桂反增痛矣皮外雖冷乃陽鬱於內也用仲景瀉心湯法但苦以瀉實辛以散結以二陳湯加黃連一錢乾薑一錢四劑後胸中作響而寬胸皮回溫續得大便暢解數次方愈員虞肱中翰己巳年三人亠口衣河舟中忽奮身跳河家人拉住嗣後言變志亂舉止失常經醫數輩皆以癲證治之月餘罔效未始招余脈弦細而數尺寸皆澀豫曰脈不長滑非痰非狂然未察其病證及相對揖讓如常但言語無倫次一日以筆晝幾作橫豎云此我也又以筆圈之云此困我也一日手摘桃葉搓之納口中手掬魚缸水欲吞復並桃葉吐去入席又言語如常又一日倦臥內房就榻診之初自遜云我少年也奈何臥於床致勞先生之多步耶忽又云昨日得一竹片刮之甚光遂口作擊竹之聲以手和之豫見言亂而出隨令紀綱傳語謂適言竹片者妄言也囑余勿信余方恍然悟矣經云腎氣不以時上故言變而志亂也謂之失志此非癲狂乃腎病也次日往診問其竹片彼尚記憶豫告曰尊恙腎虛證獨宿百日可勿藥而愈否則定成廢人矣彼拍案而立云果如此明日即出城稅居僧舍屈先生迂步就診可也次日果移寓天寧杏園余以六味地黃湯去澤瀉加當歸麥冬五味遠志而用人參三錢不加增減半月即神氣清朗微發一次嗣後兼服天王補心丹又半月則應酬如故計住四十二日因家事重大而歸晤對曰旁人謂先生必用桂附殊不知竟是六味地黃湯清涼藥也相視大笑休邑蔡育徵兄寓瓜鎮修得異疾時四月初旬或周身頭面作癢癢至不可解遂赤身臥於棕床屜滾擦不休少刻頭面遍身皆紅腫而癢不息余至診脈則浮數無倫內經有刺風一證不若此甚而多紅腫脈又數甚殊不似也因見肆中抵魚甚多本草抵魚別名癩魚食之令人多發癩疑其食抵魚詢之果然問其食時有異否云食魚腦覺舌麻此中魚毒無疑矣急用甘蔗汁蘆根汁橄欖湯頻頻雜進時許即止而遍身皮破痛楚旬日落去外膚方愈大凡食物有異即當棄而勿食此可鑑矣吳佩元兄狎妓酣飲真陰虧損其本質也忽兩胯結兩核但腫而不紅不痛瘍科以魚口治之蓋因其平素有外色彼亦自疑遂甘服五虎毒劑下之不消久而自散緣此傷陰咳嗽亦屬他醫所治後兩膝下忽又結兩核亦腫而不痛就治於余診其脈細數無力上咳嗽而下結核此真陰虛竭津枯血少為火結核也以外科證治準繩結核證與彼視之作下部瘡瘍用六味地黃湯加沙參貝母歸芍麥冬等十數劑其核一夜全消醫治一月嗽亦全止隔年餘忽大吐血其素相好之醫斥地黃湯為毒藥吐血者服地黃湯百不一生不曰陰虛而曰虛冷先以桂枝歸芍細辛木通甘草薑棗當歸四逆湯治之血不止改用真武湯又不止再加乾薑乃血儘自止遂歸功於薑附用之經年漸至喉痛失音藏毒潰膿而猶不悟延至喉爛肛爛百苦而歿夫恣用苦寒浪投辛熱不辨陰陽皆非王道病家醫家可不慎諸王以寧兄壬戌年患嘔吐證食畢片刻即吐出其時年方二十餘歲全不介意起居如常吐將百日百藥不效余作下焦翻胃以八味地黃湯兩倍桂附治之吐止後得腹痛證乃腎氣虛寒動氣衝擊為粗工攻積大下幾脫因而致虛此受害之始也越四五年先因便濁漸致寒精自出年逾四十之外因怒而耳聾用聰耳藥當歸四逆皆不效參耆亦不效一朝或聰則十數年前吐病發矣飲食肥甘不厭食亦不少但食後片刻則大吐或多或少吐一二月又不吐者一月每吐必因怒起如此屢吐屢止者年餘吐久傷氣則胸背大痛用人挺按如吐未盡則痛在脅肋必俟徐徐化下乃已漸至陽氣大虛妄見妄聞胸背氣衝而痛坐不能臥寒戰發熱大汗昏冒足痿不能立手不能舉寒精不禁陰莖全縮小便淋漓下體浮腫日雖能食然有粒米不存者種種敗證具見自己治棺而專任於余不肯易醫始終以苓桂理中湯為主用人參三五錢附子乾薑苓桂半夏各二錢約服千劑吐甚加服半硫丸若上焦虛熱則用三倍桂附八味地黃料水漬為丸日服不輟若中宮虛冷則用苓桂理中料各等分但甘草減半以棗肉為丸相參而服亦終年不輟如傷風咳嗽坐不能臥則用當歸四逆湯加附子茯苓半夏杏仁薑棗仿溫肺湯之法如斯處治歷病四年或丸或湯未嘗間斷漸致策杖能步或日全食或吐一餐而漸愈此證本於便濁傷精腎藏虛寒陰邪上逆所謂呼出心與肺吸入腎與肝腎病失吸入之權脾雖能納而不能吸反逆上而成反胃數年內有一月全不吐者二三次每因怒而復蓋怒則氣逆也初病食後即吐將愈則朝食暮吐遂漸不吐棄杖而步行此下焦反胃而非上焦隔噎以胃氣本厚幸未投疏氣傷中之藥雖嘔吐四年全用參朮為君以培土桂附為臣以益火未經劫治任醫得專故能十全斯病也吳虞能兄得肺癰證自不知而醫亦不識也正月半後招余往診則圍被抱火身坐火箱猶畏寒甚但云咳嗽不能臥寒熱時發胸背脹痛初醫先云傷風繼云肺寒用桂枝細辛乾薑二陳等藥已十餘日矣診其脈兩寸澀而數以手按其胸背則內痛甚口出腥臭腐氣此肺癰將潰故作寒熱非真寒乃內癰作膿之寒也令其去火急平肺排膿使癰早潰免傳他葉用苡仁貝母桔梗甘草防風桑杏地骨皮金銀花白芨四劑則黃白臭膿日吐兩碗因嗜煙酒肺素大熱幸不氣虛膿盡之後現陰虛細數之脈發熱盜汗之證此蓋金病不能生水純用六味地黃湯去澤瀉加苡仁貝母麥冬沙參紫苑五味等藥百劑方護完口鄉居數月靜養而康族叔偉然自揚來就診但稱兩足無力喜飲茶湯其脈細而數兩尺尤甚乃傷精失血之脈詢其夢遺否答云並無此病因其多飲擬為消證令其尿貯盆中以驗之然後用藥次日復來云尿上有浮脂下有渾濁豫告曰三消之證已得二矣渴為上消小便變為下消精隨溺出兩足無力將成痿躄大病也須清心寡欲以善藥治之何獨以足疾為患耶遂以六味地黃湯去澤瀉加人參黃耆菟絲子麥冬五味子為煎劑早晚服枸菟丸三錢客寓於真州園亭醫治百日而愈復立左歸丸方令其歸場日服後因中年無子不能節欲數年後疽發於背而歿消證有心自焚而死者此證是也員秉乾中翰長郎年十三歲出痧之後咳瀉兩月諸藥不效最後醫家竟用二神之破故紙肉蔻而咳瀉更甚便令豫診脈長而數告曰此胃熱非脾虛也必因瘀證未用石膏致餘熱仍歸肺胃邪熱不殺穀故洞瀉幸熱毒未全入肺賴有洞瀉分消其熱若不瀉則咳嗽發熱已成痧勞矣豫以清熱為主熱退則瀉自止遂用苡仁貝母栝蔞地骨皮麥冬知母桑皮木通桔梗甘草四劑反大瀉數次而瀉減再十餘劑咳嗽皆愈治病必求其本若見病治病奚有當哉族譽六郡丞蒞任梧州其地山多而濕暑月病瘧土醫攻劫而愈不無傷氣病方愈即丁艱回籍道經梅嶺路發眩暈有如中證暈退即兩足痿痹不能立不能步矣歸來召診脈細濡微數頭微暈足腫微痛尚可伸縮未致緩縱但形盛氣虛多痰多火表虛多汗此氣虛而傷濕熱謂之痛痿群醫主治不同或用桂附或用知柏或專補腎余曰病居下體著而不行脈不浮弦非風也脈不緊而痛不甚非寒也今脈濡而細數兩足腫此氣虛傷濕遵經治痿獨取陽明以人參白朮半夏補脾燥濕天麻秦艽續斷補濕熱而利關節濕則客人皮肉筋骨歸芍滋血以舒筋乃熱因濕化不用苦寒恐其有傷胃陽轉致濕不能解外以加減虎潛丸滋補腎元以堅骨痿如斯平補半載有餘遂可步履矣西林族侄本脾腎寒之質因未得子常服溫劑房事之後氣忽欲脫心慌頭眩汗出不寐他醫用人參兩許附子三錢如此重劑者四五日已服人參十數兩汗出雖止而心慌眩暈多餐不寐仍然不減相招治之診其脈細數無倫余曰始病庸或陽脫參附未為不善今已陽回而陰竭遂當陰陽平補脈細數不寐多餐皆陰虛脈證附子不宜用矣余用古方益氣補腎湯人參三錢黃耆白朮茯神山藥山萸當歸五味子甘草平補之劑服五七日遂得寐眩止漸次平調百日後食飯畢必吐飯一二口並無飽脹惡食之象彼以為多食之故遂減飯而吐如故用六君子湯不效用清胃降氣藥亦不效因思隨食隨咽即不吐停食不咽即吐者蓋不咽則腎氣不下吸也脈經曰陰虛陽無所依故令人多嘔者此證是也即遵其治法用六味地黃湯本方服四劑吐即止飲食如常已現陰虛證矣而日服補陰之藥加入人參調治年餘已可出門應酬如舊但因三年前陽脫之後畢竟真陰大傷遂有微咳咳之不已即吐血因吐血而易醫盡翻前案謂多服人參之過遂絶去人參專投苦寒以圖一時見效虛作實醫致蹈虛虛之禍反成真勞病不半年而歿李子立兄便濁經年因豪飲而起初必濕熱久則成虛迎余求治余曰淋濁須分淋自膀胱出於尿竅或膏或血與尿並出出則無餘濁為敗精出自精竅內雖大痛而尿自清或在尿前或在尿後便後尚有餘瀝馬口常濕必汙褌襠以此分別庶知療法李兄云如此則是便濁及診脈細澀無力兩尺尤甚蓋此證便久傷精愈通愈痛所以內痛連肛以及尿管醫者疑是梅毒用疳瘡治法以龍膽瀉肝湯合八正散服下痛不可解腰曲不能伸皆誤用通利之太過也余用六味地黃湯加當歸麥冬五味子車前菟絲子人參十數劑痛止而濁尚不禁再以衛生膏早服三錢煎藥更加黃耆夜服枸兔丸三錢兩月餘濁止而病全愈但尿不能直出必分岐兩道覺中略有礙處豫曰初病時乃因酒濕流注陰莖內必有小瘡故阻小便分為兩道也易以清心蓮子飲用人參黃耆生地黃當歸麥冬黃芩地骨皮車前子澤瀉甘草蓮子十餘劑瘡消小便遂為一道出矣張紫山學博初夏自真州歸其夜小便頻頻欲解又復不多有二三十次初不知服何藥三日後小便略通即肛門下迫而痛頻欲大便而糞又不燥竟不能坐惟欹倚而立診其脈沉弦細緊舌紫微渴余以初病小便頻脈又沉緊作厥陰中寒處治用當歸四逆湯本方四劑不效先年曾患痔又令瘍科視之非痔用補中益氣湯則痛墜愈甚詳審其脈沉細而緊少陰脈也腎主二便閉竅於二陰頻頻欲便亦少陰病也作少陰下利治法用四逆加人參湯主之附子三錢茯苓乾薑各二錢人參甘草一錢二劑知四劑減八劑肛全不墜又仍如初病時小便頻而痛也余因悟初由厥陰失治傳入少陰得四逆湯出少陰又復回厥陰矣重用當歸四逆湯本方加乾薑附子兩陰並治惟恐過熱傷陰每日間服烏梅丸六十粒以通其格拒之邪七日後則全愈議以八味地黃丸調理三四服後虛火發而停藥病已痊一月復如前小便頻解而作痛彼以前效之方自配藥服愈服愈甚又求治則脈細數兩尺更甚與前脈不同余曰此肝腎虛火必失精之故紫兄云數日前果夢遺驚覺未泄也余曰此肝火證非前肝冷證因遺未泄必有瘀精用生料地黃湯去山茱萸加牛膝車前子當歸赤芍生甘草七八劑後痛止溺通出敗精而愈夫均一人也同一病也前後治之各別而皆效者憑脈故也此憑脈不憑證之治法喬世臣大行少年時傷寒為醫過餓又多服苦寒貽患中寒痰飲每年必發數次腹痛嘔吐痰水盈盆而前醫猶清餓消克及余治之例用乾薑桂枝茯苓半夏甚則加附子每發輒效醫治屢年發亦漸輕病已愈矣而世兄猶恐其夏至舉發先期預服效劑乃前薑附苓夏等藥不虞病退不勝辛熱遂至吐血方停前劑然余亦不敢用苦寒因其辛熱傷陰非真陰虛損暫用生地黃茯苓山藥丹皮鱉甲阿膠麥冬苡仁甘寒之品然吐血不過一二口隨發亦隨止一年後漸增咳嗽脅肋隱痛間有喘咳不能臥者一二次脈亦細數將成弱證常以熟地黃茯苓山藥丹皮人參沙參麥冬阿膠紫苑五味子滋補肺腎之藥服之下輟前所服朮附乾薑一片不能入劑矣如斯三年幸善為調護方得血不吐而咳亦寧然後可服參耆歸術補陽之藥但遇勞發咳仍用前地黃取效今年逾強仕陰陽兩虛即麥冬貝母皆不禁清涼反用八味地黃丸而咳嗽止此皆因先之苦寒過餓而傷陽後之辛熱過劑而傷陰致體虛多病用藥可不慎諸郭元威學博壬午年三月猶寒深夜步歸平素脾腎陽虛有痰飲夙病次日即胸脅大痛嘔吐痰涎虛陽上泛面赤脈大汗出如水藥用乾薑附子人參半夏茯苓吳萸時痛時止如此七八日忽痛吐紫黑血碗許則胸脅痛減下移於腹前方加當歸赤芍官桂換炮薑以逐下焦之瘀又數日大便下黑血其痛乃止此中寒痰飲血因寒畜也繼以理中丸加桂苓半夏兼用八味地黃丸加倍桂附更入胡蘆巴以宣下焦之氣水疊為丸每日仍服理中湯一劑雖不能如平常之健亦復起居無病至癸未年四月初旬舊病復作又如前痛吐手足厥冷汗多面赤彼不自以為虛堅不用參殊不知痛吐亡陽胸痛引背脈疾煩躁勢將痛脫急令用人參五錢生附子三錢乾薑茯苓二錢漸次痛寧得臥續用熟附子炮薑理中苓夏調治猶未起床因夏至將臨惟恐陽虛陰逼所以薑附未退至五月初一即咳嗽猶以為寒痰用桂枝生薑苓夏溫肺而咳愈增至初六適值夏至即大熱大渴大咳吐血不能平臥脈變大數全現陰虛反屬陰氣當生不生而轉陰竭未敢遽用清滋先以入味地黃湯試之猶不勝其熱再以六味地黃湯加沙參麥冬五味子方合病機熱遂退咳漸止人參減半未全去也自夏至秋皆如此醫治亦復起居如常因本質虛寒立冬後即改服八味地黃丸煎劑用去附理中湯加半夏茯苓人參未輟至十一月初一冬至將臨又現陽氣不生之證忽霍亂腹痛吐瀉大作痛止即下利不禁嘔厄昏沉手足厥冷已治終事急用四逆湯加人參五錢薑附各三錢日服三劑三日方回陽又醫治一年藥不少間然過勞必發寒熱腹痛嘔吐汗出熱退即身目俱黃溺赤儼如疸證此陰黃也全不用茵陳等藥堅服參朮薑附苓桂三年之中瀕危者數次至甲申年冬月方能出門應酬如常若非任醫之專服藥之一何能至此耶許滄澄兄年二十外久病真州招余往治詢病源於前醫謂秋間患夾陰傷寒治未痊可而即停藥至冬則甚其時十月上旬診其脈虛細無神而舉止無淪神思疲倦默默不欲見人一派陽氣虛弱之證用歸脾湯加肉桂益智仁去木香告曰須冬至一陽生病退方妙至其時果半愈後因莊房回祿悶步於庭三日不寐遂病劇矣次年三月復招往看及就診兩手掩面不敢見人窗牖障黑晝日燃燭兩手枯白筋露青紫兩足筋惕身肉瞤動足踏火手抱火猶然畏寒三五日必夢遺一次雖無夢亦遺尿管連肛精道澀痛口渴欲飲飲必火上沸湯惟吞一口旋吐冷涎日食十餘餐儼如消證聞人履聲便驚汗出惜費不肯市參以致危篤至此又米令兄見其沉重托余急救一日三診而脈三變初則虛大無倫服參朮薑附藥一劑脈略斂近夜即細澀無神蓋脈資始於腎脈之頻變腎虛失其常度渴者腎虛引水自救也多餐者胃陽發露皆亡陽脫證非尋常藥之能治立千言醫案定議用仲景附子湯治少陰病者人參三錢附子三錢白朮茯苓各錢半芍藥炮薑各一錢不須加減以俟陽回如此堅服一月而畏人畏亮筋惕厥冷陽脫諸證皆愈四月來揚就醫則脈證與前大不侔矣脈虛大而尺數兩足陰囊皆腫肛右尿莖內痛微咳多餐夜反不寐夢遺雖疏而未全止多怒詈罵此陽甫回而陰旋虛用金匱腎氣丸日服三錢以消其下部之水用歸脾湯去木香加菟絲子龍骨五味子以固精用一旬則脈數大咳嗽胸痛又用六味地黃湯去澤瀉加當歸人參麥冬五味子菟絲子相參間服如此調治五十日方能步履回真州肌肉充於平昔病有變遷醫不可執豈以初治辛熱得效遂為始終不易者乎山西典客宋兄因多餐肉食而兼生冷微有感冒胸中飽脹腹痛便祕此當溫中化滯而前醫概用山楂神麯麥芽腹皮枳朴消導之劑殊不知冷食積中須溫方化過用消克反傷胃陽而食愈結醫不知此消導不放以大黃下之惟便糞水又以丸藥下之則冷結不通計二十日請治於余脈細緊手足清冷胸結而硬舌紫苔白幸腎陽不虛上結於胸未下結於藏用蒼朮半夏乾薑附子白蔻十劑胸結方開下注腹痛加肉桂日服半硫丸二錢惟進谷湯不令清餓冷祕二十八日大便微通初硬後溏大黃丸得溫方化洞瀉數次然後胸腹大開後以理中湯加苓夏砂仁溫胃匝月方瘥大升典客毛兄素有眩證發則昏僕不知人事一刻即蘇起則如常積有年矣前醫皆作痰治近因眩跌階石觸落門牙二個血流不止急招診視牙已落矣而人事如常診脈細數兩尺尤甚問彼眩時何狀答以頭一眩便不能自主瞬息即蘇問素有何病答曰夢遺三兩日一次余曰此虛火也陰精竭於下陽火逆於上龍雷之火一發即隱內經所謂煎厥也用生地黃熟地黃山萸山藥元參菊花菟絲子丹皮石斛等藥為湯丸亦如之日服不輟經今數年已不發矣貢姓武辨年二十餘取耳時為同輩所戲竟以銅穵刺通耳底流血不止延外科治耳初不以為楚仍行走街衢如常旬日間即頭痛又延內科治之益甚迎余往治則頭痛如破身體僵直煩躁面赤脈弦而緊仰臥於床口流膿血余沉思良久以為此必破傷風也檢前所服之藥皆石膏梔子芩連作火頭痛治病人云口吐膿血不是喉出不知從何而來豫曰此的系破傷風矣腦中膿血流入鼻內竅而滲於口中非由咯吐而出也破腦傷風項強已屬不治此幸未柔汗厥冷用小續命湯重加桂枝附子乾薑去黃芩一劑微汗頭痛減半兩劑頸柔十數劑後耳內結癰腦涎亦不流但其耳褎然無聞矣程士莘兄朱姓家人身體壯實跌傷手臂皮破出血專科不過膏貼藥敷而已不自知謹混堂洗浴脫衣傷風次日便惡寒發熱頭疼身痛先醫者作傷風陽證治之三四日後大汗嘔吐僵臥於床手足拘攣角弓反張始招豫治左右脈皆沉弦細緊口眼抽掣而跌傷之處反不知疼此證初病失於溫經反行解表致風寒內入直傷肝經破風反張大汗嘔吐均屬不治幸未入少陰而下利耳遂用桂枝細辛芍藥附子乾薑當歸獨活天麻吳萸甘草重劑五日汗斂身柔嘔止能食而手反不能舉軟臥於床桂附大劑一月方能起而立若非年少壯實萬無生理矣丙戌續案吳瞻大兄冬月足背生瘡久潰不斂一醫者令用刀去頑皮不無新傷春日苦寒跣足就醫又敷以冷膏隨即作癢更乘輿河畔迎面大風遂遍身麻癢面腫唇紫舌強語澀儼似中風先醫未辨何證雜用風火痰藥服後嘔噦不止余至診脈則弦緊面赤舌紫手冷多汗乃肝經風病定屬患處刀傷為風寒所襲又兼冷膏外敷證類破傷風不宜緩縱急用桂枝赤芍獨活細辛附子蒼朮天麻半夏生薑日投三劑夜半患足方溫又二劑微汗身輕瘡方知痛如斯八劑乃愈若非急治緩則傳裡不易醫矣王東木孝廉素有中寒痰飲證暑月頭痛醫作火治投以石膏梔芩而痛甚自以為劑輕益加大劑則頭痛如破以冷水漬布覆於巔頂渴欲冷飲入口即吐陰躁臥地因便請診脈已六至細疾無倫赤身猶謂熱甚而實身冷多汗余曰此陰盛格陽若不急溫則一戰而脫急進大劑四逆湯加吳茱萸半夏連投二碗孫醫後至亦同前藥但加人參少刻寒戰索被覆以厚棉幸先投藥少刻回陽次日陽躁雖愈而頭疼不止至巳午時頭痛痛即嘔噦不能食因而廢食者連旬余以頭風治療用當歸四逆湯加附子生薑半夏天麻恐頭風損目故用歸芍以滋肝也京口醫家猶云誤用辛熱及彼復投大劑石膏則痛而厥又易醫以濕痰處治用蒼朮五苓吳萸半夏而痛不止漸至患目經云因於濕首如裹而不痛痰厥頭痛則不患目其家以余言不謬復召余治易用清肝滋血辛平之劑頭痛目患漸愈王兄自檢眼科補肝丸方以夏枯草香附甘草三味為丸日服不輟遂頭目兩證全愈其方雖名補肝實清肝也乃知治病宗經必不至於大謬
