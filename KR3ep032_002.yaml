body:
  text: 卷二暑證治效張廷玉文學尊堂年七旬外癸丑年夏月中暑頭眩身熱嘔吐煩渴高年氣虛中暑正合清暑益氣湯而前醫誤作中熱以香薷飲合葛根治服四劑後遂大汗不止昏沉默臥六脈散大余曰此汗多亡陽也以丹溪加味生脈湯人參黃耆甘草麥冬五味子大劑二服脈忽斂小如絲人事略清旋即下脫飲食倍常大便頻下隨用人參耆術各三錢薑附錢半五味子甘草為佐日投三劑汗瀉減半而脈不起因思高年茹素氣血兩虛草藥不應宜加有情血肉遂以黃耆白朮熬膏用鹿茸為末入膏內以人參煎湯調膏日服三次如斯半月汗瀉方止始能言語方省人事詢其月日皆言不知蓋高年氣弱因暑傷氣以致身熱頭眩此氣虛發熱若初投參耆則熱自退所謂人參黃耆甘草退虛熱之聖藥也失此不用反辛香散氣陽因汗越所以表愈熱而里益虛致大便頻下而垂脫矣鄭襟宇余族叔祖也年六十外初秋每日僕僕道途夜忽小便多極兩倍於平常且頻數不已次日即發熱口渴先醫作瘧治一二日即小便淋滴不斷竟無寧刻余往視之見其面垢齒燥口渴脈浮而弦此病似瘧而非瘧乃仲景之中暍證也暑邪中於太陽膀胱經以膀胱自受病不能司出納之權是以小便頻數且面垢齒燥口渴脈弦的屬中暍用白虎加人參湯一劑身得微汗熱渴旋止小便即如常矣蘇茶館內人夏氏年近五十身素瘦弱盛暑得病半月歷醫數人因其身熱煩躁舌乾口燥間出妄語胸前發紅疹數十點皆作傷寒治之至十七日招餘一診以備終事診其脈細遲無力重取欲絶並無傷寒六經形證乃中暑虛熱也以湯試之惟咽一口響至少腹唇口雖干全無血色渴惟熱飲病中日出大便惟三日未通此腹餒非陽明內實也斑乃胃虛虛火遊行於外急用米湯以救胃氣藥用人參白朮麥冬五味茯苓甘草陳米甫一劑下咽即神清舌潤斑俱散矣勸其進食其夫恪守前醫之言堅不與食至夜則咬牙寒戰現虛寒真象再用理中苓桂溫補回陽後雖欲進食而胃氣大傷見食即嘔乃於榻前烹炮香餌以誘之溫劑兩月方得起床袁調寡內入年近五十身肥夏月患病晝夜不寐痰喘嘔逆大小便祕將十日矣歷醫多人不效惟治棺於臥側以待死耳其壻邀診以決遲早診其脈弦而滑重按有力其證煩渴發暈嘔噦不食痰喘不能臥有汗身熱前後便祕喜暗畏日窗牖布障余曰此暑痰也何至於死以大劑古方香薷飲加二陳湯合劑令煎熱服病者云大小不通服藥徒脹惟候死耳延至次日其壻力勸方服一劑吐痰涎甚多微得汗即合目略睡片時再進次劑腹內腸鳴大小便齊通次日再邀診視抬棺他所矣金爾立仲子七月間暑途奔走頭面生小癤甚多不數日遍身發大紅斑如雲片臥則色赤坐則色紫幸而作癢前瘍科用涼血清風之藥三四劑後漸變壯熱煩躁口渴臥則斑紫起則紫黑迎余往治切其脈弦長有力乃風暑中於陽明未用辛涼解散故也蓋陽明多氣多血之府血為熱鬱而成斑臥則氣下坐則氣上所以臥則紅坐則紫矣溫熱病發斑自內而出皮外不癢若如此大斑而且紫萬元生理此風暑癮疹雖非熱病必須仿傷寒治法以葛根赤芍解陽明之風香薷飲解陽明之暑白虎湯化胃熱之斑三湯合劑四劑後斑色漸淡十劑斑散癢止惟熱渴未除六日後以小承氣湯一劑微利而愈計斷飲食八日程蘭頴太學尊閫年將五十平常茹素時當酷暑傷氣因食瓜果寒中遂大吐瀉證屬霍亂因本體自虛吐瀉汗出遂致亡陽煩躁亂走復不能走用兩婦挾之而行余急往視竟不避親疏亦不自知何以至此診其脈散大而數面赤戴陽欲食冷水余曰病急矣不急救一寒戰即脫先以大順散用熟水冷調服下面赤漸淡欲扶進房余曰得之矣時令叔馨九兄在座主持即取人參五錢附子炮薑甘草各二錢煎成冷飲然後躁定方扶上床閉目片刻脈始收小計一夜服人參二兩姜附各兩許次日蘭兄真州回揚已大定矣溫補半月方得起床若其時用藥不力何能挽垂脫之真陽乎次日延請外境名家只用歸芍六君子湯加人參一錢抑何輕視前證耶吳景何翁暑月居母喪因佛事赤日行於途夜又露處於檐外遂中暑嘔吐腹痛作瀉發熱手足清冷而有汗其人本體虛寒暑月尚著夾衣此暑傷氣而里更寒非中熱霍亂之比先用消暑丸二錢以開膈上之涎痰而止嘔繼用附子理中湯加半夏茯苓砂仁溫中而消暑其時有客以不用香薷飲六一散為疑者余答曰暑者天之氣也而人稟有厚薄稟之厚者感天地之熱氣則愈熱矣稟之薄者感天地之熱氣反消己之陽氣而益虛寒矣暑則一因人之虛實而分寒熱以施治豈可一例而論者如此溫補三日本氣壯盛暑邪外解而病愈古方消暑丸以半夏生薑為君而大順散漿水散皆乾薑桂附以治暑則暑病之不概用香薷於茲可見矣吳瑾仲郡宰令政年近五十素有經水似崩之證乃氣血兩虛之體也暑月出門拜壽勞而中暑歸家手足麻木厥冷汗出如浴脈細如絲此氣虛中暑正合清暑益氣證不虞前醫作中寒治用人參一兩加乾薑附子半夏吳萸其時手足雖溫汗雖旋止而虛煩畏熱席地而臥漸至怔仲不寐日夜頻餐有類中消內伏暑邪時時泄瀉如斯四十餘日日服人參二三兩又擬加鹿茸以止瀉病家惟恐亡陽急脫請余診治切脈至止調勻雖虛細而兼數虛則有之未至於脫也人參當用不須若是之多此中暑之膈消也用人參三錢白朮茯苓石斛麥冬五味子當歸丹皮枇杷葉甘草兼補兼清出入加減五日後即登床而臥十日後即食減如常半月後經水行多即加黃耆棗仁而減少人參去丹皮枇杷葉麥冬但家事多勞氣血本虛參耆補劑服之經年而不能少間耳一坊役貧人素有失血咳嗽證夏月過勞傷暑次日發熱而有汗前醫作傷寒治不效又作中熱治絶食五日忽大喘大汗其父慌迫急迎往視則大汗淋漓發喘不已兩手脈細如絲尚不及三至幸未厥冷余曰外無傷寒形證脈證欲脫必誤餓至此詢其氣從何處起病者云從心下起余曰尚可治若自臍下起則宗氣離原不可治矣急以粥救之食下喘甚入胃片刻即喘定少刻又喘因思胃中空虛粥入胃旋即下入腸腸實而胃仍虛所以又喘須糜飯留胃乃可續進飯一碗汗即止喘即定稍停又進飯一碗喘亦定後徐徐進食未藥而愈程姓同舟之人也盛暑在船忽大吐瀉吐止即頭汗如雨草枕皆透水瀉不禁任其下流周身抽搐證類轉筋又或有時麻木如是者半日診其脈則浮弦有力且頭汗身熱斷非虛寒經云暴注下迫皆屬於熱此暑風證也余未攜藥裹舟至丹徒鎮市藥用香薷葛根防風厚朴扁豆赤苓木瓜澤瀉甘草煎服得臥片時反周身大汗遂熱退痢止晚至京口即可步行登岸矣方哲先兄在室令愛夏月恣食瓜果伏暑霍亂瀉止而嘔吐不止已三日矣他醫用薷藿二香湯皆吐不納第四日延余而脈細緊無倫他醫以緊為數將用黃連乞余決之余曰若暑霍亂一經吐瀉邪解即愈今瀉止而吐逆更甚此中寒厥逆於上也緊寒數熱相去天淵今陰陽格拒藥不能下失之不溫發厄煩躁厥冷即不可治矣先以來復丹以開格拒而止吐繼用四逆湯去甘草加半夏茯苓以溫里囑煎成冷飲仍令質之前醫再行與服恐招謗也及余甫出門病者即發厄少頓即欲下床臥地方以余言不謬先化服來復丹果吐定再服四逆湯片刻稍寧繼服二煎嘔止得臥次日再診緊脈下移兩尺乃寒注下焦反增腹痛仍用前劑加肉桂甘草服三日而愈瘧疾治效吳苑仙守戎戊午年七月酷暑乘馬出門恣食瓜果歸署即寒熱身痛脈得弦數告以瘧證用芎蘇飲二劑汗出而解次日自以為無病矣殊不知間日瘧也其夜犯房事次日瘧作寒熱煩躁因裡虛不能作汗熱遂不退更醫作傷寒治二三日熱仍不能退用滾痰丸下之大便後即於穢桶上氣脫大汗遺尿進人參一兩灌下方回回則脈細如絲汗猶不止繼以附子理中湯回陽三日裡氣得溫邪方外出間日之瘧依然發作但發時左脅脹痛咳嗽不已將解必大汗亡陽幾致暈脫者數次皆重用參湯救回治瘧則以桂枝當歸赤芍白朮人參茯苓半夏甘草薑棗為引如此補劑瘧止者二次皆因勞而復再用參朮汗愈多而咳愈甚竟致坐不能臥即臥亦左半身不能著席因思先傷風暑已經兩愈其病中犯房事肝腎之陰虛未復邪深入於裡故致咳嗽不能臥用六味地黃湯加人參五錢日服二劑如此半月瘧咳皆止尚半身不能著席幾成瘧勞仍以地黃湯加人參二錢兼服地黃丸一月方健病中犯房豈細故耶陳玉生秋間病瘧截藥亂投將一月瘧未止而又病痢瘧痢並作者又數日矣最後延余診其脈尚浮弦有力蓋瘧邪因截不得外解內搏作痢邪猶在半表半裡之間以倉廩湯本方不用人參即敗毒散加陳倉米也連進四劑令其取汗上身得汗而瘧止再進二劑通身得汗而痢止乃經營之人見瘧痢皆止便不藥矣遂大勞致中氣下陷又似欲痢之狀然脈虛大有汗不熱用補中益氣湯二劑隨愈又不藥矣五六日後忽神昏譫語慌迫求治診脈弦滑而數蓋前瘧痰未清不藥留病勞而傷氣不得不補此虛回痰作所以譫妄也用溫膽湯古方陳皮半夏茯苓枳實甘草生薑竹茹六劑後嘔吐痰涎甚多其病如脫此證幾兩月始終以去邪而病解未常以久病補虛故治病必以脈為準也王君聖翁乙丑年七月下旬得瘧疾前醫者已半月皆柴葛黃苓二母二陳等藥不效困憊在床迎余診視面目黧黑間一日發脈則單絃而硬歷醫甚多補瀉溫涼用之已盡歷秋至冬益至危篤元氣大虛竟無汗解身目皆黃其發也由兩足筋抽即惡寒漸次上衝於腹腹則脹大如鼓湯飲不下惟能仰臥兩足直伸不能轉側寒熱輕而脹重全無汗解發則必一晝夜耆朮下咽腹肋脹痛臍旁有動氣諸醫束手矣蓋此翁年逾五十素恃強健初瘧汗解以為病退房室無忌情或有之深思瘧狀從兩足上衝入腹腹脅脹痛面目黧黑小便點滴難出脈弦而硬不受耆朮皆腎肝病也病經五閲月真氣敗傷瘧邪深入須補腎藏陰陽使本氣壯實逼邪外解今氣已沖胸脅未及於喉若再上衝必增喘厄以金匱腎氣湯本方兩倍桂附加人參五錢病人苦藥日投一大劑服至七八日足抽氣衝減半而瘧勢反彰余曰無慮也此正氣與邪爭也正勝則得汗而邪外解執方不用增減又服二旬至大寒節次年初氣則大汗三身而瘧止矣但一足筋攣不能步履至次年上元節方登室會客而足跛者仍半年病之前段衆醫所療後半節專意委任乃以意治效未作瘧醫也梁德卿在室之女八月間患瘧四十日矣前醫見久不愈用參朮歸芍鱉甲知母補截兼行治之愈甚每日只二時安寧隨又發矣診其脈弦而緊且不發時仍惡寒身痛余曰病雖月餘表邪未解半入於裡所以似瘧而非真瘧幸為室女裡氣不虛未盡傳裡何以補為即於是日起停止飲食作傷寒治法以羌活桂枝柴胡蒼朴二陳生薑表裡兩解四劑方得汗寒退身不疼去羌活又四劑熱退至六日寒熱皆盡而似瘧亦止大便隨通病雖久而邪未除必以去病為急即所以保正氣也吳靜含河員初秋患瘧乃因熱求涼過餐生冷寒瘧也起時殊不重余初診令其節飲食戒瓜果不合病人意遂易醫恣其所欲瘧熱作渴縱飲冷水至一月後病勢危篤形骸骨立胸中塞滿粒米難吞嘔噦不息晝夜俯坐於床不能平臥每日一發自午至寅無汗而止日惟二時進藥飲湯而已不得已復邀余治脈則細緊如絲兩足冰冷雖瘧發熱而足亦不熱坐不能臥數日矣此寒極於下厥氣上逆中冷甚矣辭不治堅托不已議用附子三錢乾薑半夏茯苓各二錢人參一錢如此不加減服十餘日嘔逆方止能平臥得進米飲續續得汗瘧亦尋愈後因勞兩復仍用前方減姜附一半加入桂枝白朮赤芍生薑至十一月冬至後方脫然許用賓翁溧水李令親秋月患瘧嘔吐長蟲蓋先醫過用苦寒所致六七日後招余往治脈弦而遲乃陰寒脾瘧主用桂枝蒼朮乾薑半夏茯苓白蔻生薑服五日瘧止矣即以六君子湯加炮姜調理飲食亦半餐忽然舌黑不幹脈變虛數別無他證病人驚怖余曰無傷因本體陰虛前治瘧過溫瘧雖止而陰氣稍傷用地黃一二劑可退用賓曰前藥熱而效今藥用涼倘益病奈何余曰必效果一劑而舌紅黃矣若系中寒虛冷脈必沉遲見嘔脹諸證矣方豫章部司尊堂秋患瘧本體虛寒前醫誤投黃芩知母多劑致發寒時大吐吐極大汗遂昏厥而脫全不知人時半夜矣急迎往看則六脈全無手足厥冷目合不語牙關半開半閉惟身體不僵未全冷耳余曰證脈全脫藥能下咽方可救也試以薑湯能咽即以人參五錢附子三錢白朮乾薑各二錢煎成頻頻灌下至天明手足回溫再劑目開三劑手能動四劑脈出如絲至一周時方能言也至第三日元氣稍振而瘧復發即以前方減參附一半加桂枝赤芍半夏甘草生薑大棗解肌溫里每日二劑六七日瘧止矣苦寒傷胃亦至如此族其五主政仲秋舟中感寒歸來患瘧寒多熱少巔頂痛腰背疼汗出不止脈弦細而緊瘧發則小便不禁滴點不休此非三陽證乃厥陰瘧也用人參五錢桂枝赤芍細辛炮薑半夏甘草薑棗為引服後汗少寒輕而尿不固加附子五分遺溺止病人畏熱不肯再劑瘧勢減輕方加白朮當歸因調理失宜瘧復者三皆以參耆歸術桂枝赤芍甘草薑棗等藥月餘痊可若宗時派以柴胡為套劑豈不益病乎王木文兄初秋場中築鹽日受酷暑夜沾風寒回揚瘧作歷醫數人皆柴葛香薷知芩二陳等劑病全不減十日後迎治脈則浮弦而數瘧發身痛寒極而熱熱則渴甚汗多小便痛而難出此風熱未解須用仲景陽旦湯風熱兩解也用桂枝赤芍黃芩甘草加葛根厚朴茯苓二劑知四劑減輕六劑瘧止不數日又復往場半月後回揚三四日瘧又復發初亦非余治勢甚重始招再醫詢其病狀大非前證發寒時便腹肋脹痛熱則起床亂走譫言妄語其勢若狂渴飲不休診其脈則細數無倫巔頂作痛小便痛而難出此皆厥陰病豈非女勞復乎遂用當歸四逆湯加附子生薑大棗一日輕二日減三日六劑瘧止矣治瘧效速惟有此證以辨經不謬也若以前用黃芩而效再用前劑豈不殆哉程馨九太學九月上旬自淮安患瘧回揚已發四次其瘧甚輕而本氣甚虛寒熱之後汗出不止雖系少陽風瘧而初劑即用人參桂枝赤芍為君柴胡陳皮半夏茯苓甘草為佐薑棗為引如此十劑瘧止十日矣因憤怒勞復又值夢遺余適有江南之役回往十日則病勢危矣瘧則不甚而元氣大虛日夜汗出不止開目亦出飲食亦出小便不能頓出惟聽其點滴更增咳嗽不能側臥惟仰臥於床因重用人參八錢附子三錢何首烏三錢每日二劑瘧勞稍輕又復夢遺至冬至日陽氣不生則病愈劇日出汗十六身衣被盡濕股肉皮傷幸胃氣未敗粥食可餐大便禁固其時謗議紛紛謂瘧復不用柴胡而用參附幸聲兄不疑且有內親曹啓心兄贊助冬至日防其陽脫惟用參附湯三劑每劑人參一兩生附子五錢如此三日汗方止半而有生機嗣後每劑人參一兩白朮三錢何首烏三錢茯苓二錢日服二劑以治瘧夜服八味地黃湯兩倍桂附加人參五錢以治腎虛之咳嗽如斯一月至十二月半大寒節候瘧方止嗣後日服前參朮藥一劑八味湯一劑至次年上元節後不用參朮等藥專服八味湯一劑以補肝腎初夏方策杖步於庭此證費參價數千金若人力不及信任不專何能望治後每咳嗽或因風因勞皆以八味地黃湯重加人參即效總由肺腎虛寒也高學山文學尊堂年逾六十平素多痰而胃冷初夏便餐水果因而病瘧歷醫十三位已兩月餘而瘧不止漸增嘔逆滴水難下藥亦不納舌苔全黑瘧反不發微有利意最後相招診其脈沉弦而緊重按滑而硬求治於余苦藥不能下咽檢前方皆黃芩知母貝母柴苓湯也原因停冷致病又益以寒中冷藥瘧邪全入於裡寒痰格拒非尋常藥能破其堅壘以半硫丸一錢薑湯送下覺胸間衝開即不作嘔繼進乾薑附子半夏茯苓白蔻橘紅大劑與服竟不吐余曰能藥矣但瘧復發方允可治學山曰他醫要截藥而先生反欲瘧發豈不相反耶余曰瘧者外受之邪也知在何經宜用此經之藥驅之使出此善治瘧者也尊堂太陰脾經瘧也當用脾臟之藥則中的矣而用柴胡乾葛黃芩少陽陽明之藥與太陰何與焉今瘧固在脈尚雙弦固本氣自虛邪陷於內非竟止也中氣稍振瘧必再發加人參一錢於前藥內以助中氣俾邪外解服至三四日胃溫嘔止能進米飲而瘧發矣較前更甚遂改用桂枝赤芍生薑以解肌不用人參以蒼朮半夏乾薑附子陳皮茯苓甘草以溫里如此六七日飲食略進瘧發有汗寒熱減輕復加人參換白朮又六七日飲食可餐而瘧全止不虞先原停冷又服涼藥積冷尚存少腹遂脹痛溏瀉而又轉痢脈復緊滑此腸胃尚有積垢又去參朮用蒼朴香檳薑附赤芍二陳等藥十數劑大便通暢瀉痢尋愈調治五閲月方能步履嗟乎瘧之較傷寒只差一間耳傷寒則自表傳裡瘧則專經而不傳何得瘧疾不分經而套治耶吳㑲庭文學年二十餘本質陰虛秋病瘧至冬未痊迎往真州以治之病已五月瘧邪雖輕而真陰大損因病中時時夢遺不能禁固致瘧不瘳脈弦細數而無力畏寒不欲揭帳脅肋氣衝而痛臍有動氣半身不能側臥腰膝痠疼不能久立間或咳嗽自汗盜汗而陰毛皆變白色證現肝腎兩虛檢其前方皆柴芩二陳二母鱉甲清疏之品間有用人參白朮者亦未服余主補陰俾邪自解用桂枝當歸赤芍何首烏葳蕤茯苓人參甘草薑棗為引仿建中湯治法因當臍動氣脅肋氣衝皆肝腎之病故不用耆朮也外朝服枸兔丸以固精全不作瘧治半月而瘧止矣後以參耆入六味地黃湯調治而康十數年前㑲兄尚在幼齡秋病痢前醫辭不治余不知也迎往真州治之診其脈滑數有力乃濕熱痢證不足慮也檢前方則山楂厚朴當歸白芍木瓜金銀花陳皮而已余曰邪重藥輕何能破其積滯耶遂用黃連木香檳榔蒼朴枳殼赤芍山楂大劑二脈而下結糞尺余兩日痢止次日辭行復診留藥其舌或變黑見幾上𪻳貯葡萄乾問曰食此乎㑲庭曰然令拭去無跡家人問曰食此能黑舌乎余曰然㑲兄笑曰無怪前某先生辭不肯醫矣彼固因舌黑也其日亦食葡萄乾附記以為舌鑑吳坦如兄初冬真州抱病回揚外證則微熱微寒頭疼咳嗽喉痛不甚而脅肋連腰則痛甚脈則弦細緊而搏手按之又無力自以為風伏火求為發散豫曰脈證陰陽相半表裡皆寒幸有頭痛發熱邪猶未全入里也此厥陰傷寒證以其十數年前年甫三十曾患中風半身不遂用過桂附故不驚疑遂用桂枝細辛赤芍附子炮薑吳萸半夏桔梗甘草生薑以當歸四逆加減投之如斯七日喉痛止諸證減遂轉為瘧疾脅痛雖減而不能側臥咳嗽不除瘧疾日發其緊脈雖退而轉弦細七八日後脈更兼澀平素肝腎虛寒遂加人參當歸以培陰血因肋痛咳嗽恐成瘧勞服參附歸芍桂枝苓夏甘草之藥百劑其中三復皆如此治法方獲脫然程越峰文學南場應試患瘧歸揚初醫不辨何經惟投套劑不過柴苓知貝治不愈遂用截瘧毒丸空心井水吞服以致少腹裡急似痢而前醫猶稱暑氣益用香薷陰凝寒肅瘧邪入里竟不發矣而手足厥冷腹肋隱痛下痢紅水求治於豫脈則弦緊無倫此厥陰經瘧也急宜溫里使瘧仍從外發不然即痢下不止矣以桂枝細辛附子乾薑赤芍吳萸半夏茯苓甘草重劑七日手足漸溫惟腹尚痛或下膿血因里得溫陽氣稍振瘧仍發出但緣誤治傷中遂以前劑加人參當歸去細辛吳萸半月瘧止因力薄停參瘧又復作以白朮代參計服姜附藥九十劑瘧已止而便實彼因齒痛遂去姜附無參而加黃耆遂胸脹不能食少腹隨痛仍照前方去黃耆加姜附十數劑瘧方止而痊誤用苦寒井水姜附百劑方得破彼堅冰前吳瘧案亦厥陰瘧也始即用溫藥亦百劑方瘥未誤苦寒故未下利治瘧不辨六經不分陰陽浪投劫藥醫家病家皆當致警痢疾治效朱貞啓文學年六十外初秋患痢其證惡寒發熱脈浮而數頭疼身痛目赤口乾而又腹痛痢下膿血不離穢桶此雖挾表之證其勢甚危乃疫毒痢也表裡皆病必須先解其表而後攻裡正合敗毒散加陳倉米乃屬倉廩湯之證遂以羌活獨活柴胡前胡川芍茯苓枳殼桔梗甘草陳倉米日投二劑身得微汗表熱里痢皆減半浮脈雖平而虛數不斂此高年氣虛即以前藥遵古方加人參一錢二劑遂大汗通身熱退痢止邪從外解竟不須攻裡矣休邑黃益之時寓瓜鎮年七十四歲秋初患痢疾六脈雖大而尚有力赤白相間初以平胃散加歸芍香砂四劑積滯已行而痢不止下迫益甚小便難出六脈更大而無力余議用參附其鄰醫曰痢脈忌洪大而又有血反用參附殊為不合余曰老人脈大為虛今脈大而不數重取無力此氣虛非熱也乃中氣虛寒逼陽於外致脈亦浮於外也痢疾屬腎腎主二便開竅於二陰今小便祕而大便不禁乃元氣下脫宜升陽溫腎非桂附不可遂用人參三錢耆朮桂附炮薑當歸茯苓各錢半升麻甘草各五分四五劑後小便即通脈亦斂小不十劑而痢止矣後用八味地黃丸加破故紙五味子調理一月計服人參半斤而痊此治痢變法因其年邁也溧水藥店張姓初秋患痢晝夜百度不能離穢桶乾嘔煩熱而手足反時冷脈又細數渴食西瓜片時隨即利下而色不變醫議紛紛或云完穀不化手足時冷恐屬胃寒余復細驗脈雖細重按則長齒燥舌黃斷為熱厥此邪熱不殺穀因胃熱極傳化失常不及變而速下此經所謂暴注下迫皆屬於熱也用大黃三錢黃連二錢厚朴檳榔白芍木香為佐乘熱與服微寐片時腹中大鳴洞瀉數次積糞甚多而痢減半即去大黃加當歸陳皮澤瀉數劑而愈周子仁深秋患痢自恃知醫先以巴霜丸下之不減恣啖酒肉全不禁忌又進大黃丸下之益甚又自服平胃香砂歸芍等藥亦不效晝夜四五十次將近一月急招豫治脈則細數身熱乾嘔不食面白唇紅左肋氣衝而痛下痢純紅愈便愈墜投以黃連歸芍香檳苓草陳皮不效然所見諸證皆痢所忌視其人清瘦素屬陰虛巴豆治寒痢大黃治熱痢寒熱亂投下多亡陰季肋屬腎痢亦腎病當變法以治之補陰為本治痢為標用生地黃歸芍為君黃柏人參陳皮甘草陳米神麯為臣日進二劑脈數唇紅稍退遂執此方堅服半月漸次減少而愈若以脈數身熱下血唇紅乾嘔不食棄為逆證而不以下多亡陰用滋腎治法奚望其生乎族兄曉齊先生尊閫深秋患痢年近六旬夏日貪涼食冷乃寒痢也以自知藥性喜補畏消更惡熱藥諸醫順其性惟以平妥套劑治之因循日久轉變虛寒有用肉桂者有用黃連者無所適從決之於余診其脈兩尺全伏舌苔灰黑噦聲近厄足冷至膝布障窗牖畏見日光脈證皆大虛寒以書證病確當溫補遂用人參三錢附子炮薑肉桂茯苓芍藥各錢半暮夜請醫不到勢急勉煎而病人亦神昏不辨何藥服後隨得熟寐醒索再煎又照前方一劑次日足溫厄止痢亦減半繼延團分璜余適往探不令余診恐余用熱藥也然分璜以余藥為宜隨又迎京口吳時乘用藥亦同惟加附子三分耳因病人最惡熱藥時乘令將人參炮姜先煎湯於藥罐內以白朮歸芍茯苓甘草陳皮佐助群藥面投罐內以免疑畏用術治愈汪紫臣翁深秋患痢歷冬不瘥日不過三四次夜或便或不便腹不痛但腰下一墜即便膿血矣歷醫二三人皆不效然飲食起居如常最後問治於余診其脈弦而無力兩尺細緊余曰非痢也此經所謂大瘕瀉乃腎氣虛也蓋腎主二便今大小兩便一齊並出小便不能單行此五虛證之一謂之瀉利前後理宜補氣用人參耆朮當歸桂附故紙五味升麻服十劑紫臣云全不效余曰虛回痢自止不能計日取效非余故留病也遂疏方請自制藥日服期以小便能單出為效服藥將一月相遇於友家喜曰昨日能立出小便矣令其再服十餘劑勿功虧一簣後遂全愈若作痢治則去道遠矣方豫章部司素虛寒初秋患痢日夜十多次紅白相半脈弦細緊反不惡寒而微發熱頭疼身痛若以脈細緊為寒大當頭痛發熱以頭痛發熱為濕熱脈又不當細緊然必以脈為準定屬厥陰病寒凝於內反逼陽於外也況厥陰病原有頭痛且肝藏血理宜用當歸四逆湯本方加附子乾薑吳萸解肌溫里俾邪外解每日服藥夜必微汗次日必熱微利減如此六七日則表熱里痢皆痊以後三年初秋必病皆如此治之余弟思承年五十六歲宣城貿易初秋酷暑日食苦蔗菜即本草所謂敗醬也且餐石膏豆腐淡薄水酒平素中寒因而腹痛作瀉瀉後數日即痢疾矣十餘日余歸脈雙弦緊硬而兩尺尤甚胸中飽脹不能食臍旁動氣按之痛晝夜五十遍腹反不痛惟尾閭一酸墜即下痢矣小便點滴難通惟與痢並出觀脈之緊硬腹之不痛此腎藏虛寒之痢無疑矣初即用附子乾薑肉桂歸芍蒼朮香砂十數日不減而下迫益甚更換白朮茯苓去香砂乾薑亦不效益之以人參黃耆升麻亦不效再以八味地黃三倍桂附為丸清晨吞服夜用鹿茸鹿膠鹿角霜為丸雖稍減而亦不愈如斯大藥服之百日至立春方減至十數便因痢久下陷成痔日下鮮血而緊硬脈不退但停鹿茸丸煎劑之桂附八味丸之桂附仍日服不輟至春分日方一夕而痢止次年八月即上年得痢之日又復痢疾仍如前煎丸並服又不見效再以硫黃之玉粉丹服之一月至冬至前後方痢止乙酉仲秋前痢又作因食蟹所致如前治法冬至方回此痢之虛寒世不多見因屬胞弟彼此不疑故得獲效於萬一也
