body:
  text: 卷一傷寒治效魏虞成學博壬申秋得傷寒似瘧諸醫皆以柴葛解肌枳朴化滯或作瘧治而寒熱無定期且無汗解因熱不退又進大黃丸下之而不便至十八日招余診視脈來弦細而緊三脈皆陰舌黑而滑乾噦不休頻欲飲湯甫下咽即嘔出而水倍之當胸結硬腹亦微痛告之曰余治法不類諸醫恐不相信也此證已轉虛寒非溫劑不效舌黑而滑腎水凌心飲湯即吐引水自救皆屬少陰況已汗已下而邪猶不解反增嘔噦陰躁不眠乃亡陽之機常藥不效遂立方用生附子三錢茯苓四錢乾薑二錢甘草五分乃茯苓四逆湯也令其多迎高明參議未敢奉藥惟團弘春首允他皆不然至暮乞藥於余服二劑躁定四劑舌退黑六劑熱除八劑嘔止能進谷湯照此藥再加半夏八九日後粥食漸進而大便冷祕不通兼服半硫丸五日大便方通而病解計服溫藥一月甫能離床又如君汪庚申年在瓜鎮時九月杪得傷寒初幼科醫治先發表即大汗如水繼和解而熱不退益增煩躁再投白虎涼膈即神昏默睡喚亦不醒搖之惟開目而已病至十九日自郡迎余至瓜鎮切其脈洪大無倫重取則散身重蜷臥余曰此因誤治寒入少陰矣初必夾陰傷寒宜用溫經誤投表藥致魄汗淋漓陽因汗越益增煩躁再服苦寒陽氣愈消致耳聾昏睡此少陰非少陽也脈反散大乃真陽欲脫之機特進投附子理中湯二劑服後脈稍斂欲小便及就桶小便已即寒戰口張欲脫再以理中湯重加人參連進二劑方陽回蘇醒次日回郡留理中湯方藥調治半月始痊趙宅寡居蔣氏年四十外五月得時疫傷寒初醫未辨時疫概作傷寒正治發表有汗而熱不退再用清熱即乾嘔吐蛔七日後延余往治脈弦數而無力余曰此時疫證乃邪自里發於表非若傷寒自表而傳於裡也初因誤汗徒傷正氣清熱必定寒中以致乾嘔吐蛔急宜溫中安蛔免邪入里即以小柴胡湯加炮姜去黃芩四劑嘔止蛔安而經水適至夜則譫語即前方加當歸赤芍紅花作熱入血室施治至十一日乃大戰汗出而解已身涼脈靜一日一夜矣忽復煩躁面赤戴陽渴欲冷飲赤身跣足或歌或哭譫妄如狂他醫有謂汗後餘熱未盡當用竹葉石膏者有謂汗雖出而里未通宜用承氣者又有謂余先誤用炮姜藥貽患者議論雜出余答曰皆不然初因邪未出表而誤汗以傷陽氣致中寒乾嘔吐蛔又值行經而傷陰血氣血兩虛故出戰汗幸戰而有汗邪方外解若戰而無汗正屬不治今身不熱而脈反大乃真陽外越不急用參附必再戰而脫余主用四逆湯加人參煎成而不敢服瞬息間病人索被惡寒方信余言即以前四逆湯乘冷灌之面赤漸淡就枕略睡片刻醒則又躁即急煎如前大劑亦用冷飲方熟寐一時及醒問前事全然不知反倦臥於床不能昂首矣用參朮炮姜一月方瘥呂惟鬥翁令眷住居儀真癸亥正月初旬余自真州發郡路遇令壻黃蒼潤兄價執帖相招至診其脈細數近疾重取全無舌卷焦黑齒垢枯黃臥床去被露胸取涼問其病源初二日開窗梳頭受寒前醫用麻黃湯發汗汗出後即煩躁因而又用石膏白虎湯遂致如此口索冷水復不能咽而房內又設火三爐余曰病人如此怕熱何須置火家人答以主母平素畏寒日常所設余曰若此乃陰極似陽亡陽脫證辭不治其時朱性生翁在座力囑用藥勉以四逆加豬膽汁湯主之生附子三錢乾薑二錢人參三錢甘草一錢人尿豬膽汁各五匙煎成灌下一半而人即昏沉不能咽約一時許回蘇已離魂至江口醒云揚州醫生藥好復索余藥服後熟寐次日回陽齒舌潤滑如常畏寒矣繼用理中生脈湯十數劑而愈續溪堪輿方於長年將六旬自徽初到維揚為方宅卜地時癸亥初冬彼不知江北較冷多啖海珍蓋覆單薄夜受寒冷因之頭痛發熱忍隱不藥而飲食又未節逮傳至陰經乾嘔胸脹舌黑干卷脈細如絲方求醫治因其脈證諸醫僉云不治宜遷別寓而卜地主人不忍使遷最後招余以定去留余診脈望形答以不死其語音清響身輕自能起臥無煩躁下利厥逆等證病脈似少陰而實太陰也因肥甘在胃冷結不通食壓太陰致脈不出中宮壅滯津液不能上輸致舌乾齒燥用四逆湯加人參作太陰霍亂治法乾薑三錢附子二錢人參甘草各一錢陳皮二錢服至六日腹中腸鳴冷食熔化大便暢解二次脈出舌潤次日黑苔轉黃胸寬思食矣此證內實似虛冷證似熱若不以形證相參幾至不救要之陽氣未傷身輕不厥為可治也附誤治案全椒鬍子任寓王東木兄宅二月上旬舟中受寒即中陰經王兄知醫自以桂枝姜附治之暫減因無發熱頭痛病者漫不為意飲食不節酒肉無忌致邪不解如此半月坐食時忽不能起立遂困臥於床漸變神昏謬妄舌黑而干迎醫治療不識寒邪入里食滿胃中誤以舌乾謬妄認為前服熱藥所致因身有紅影遂作斑狂初用生地黃玄參麥冬石膏升麻黃連不效益加犀角大黃如斯三日大便不動而病愈篤前醫自遜不辨何證易余診視脈則一息二至似雀啄之象證則舌乾而黑身痛不能轉側口不能言余辭不治因告之曰此水極似土內經亢則害之證也今舌乾不渴陰也脈只二至陰也謬妄聲低乃為鄭聲陰也身重痛不能轉側陰也夜則譫妄日則但寐陰也身有疹影乃寒極於內逼陽於外陰斑也具此六陰其舌乾黑者乃寒極於下逼陽於上假熱也因一假熱而棄六陰悖謬殆甚王兄力囑勉用附子人參茯苓四逆湯五日脈起三至身輕能言稍有生機至六日真陽欲絶夜汗三身遂肉瞤筋惕脈脫亡陽乃苦寒結陰大便冷祕竟成藏結藥難下膈又延六日而殞前方於長舌乾齒燥用四逆湯而愈以此證之誠誤治也存為舌鑑余青岩廣文令眷年近三十夏初得時疫傷寒初起不惡寒但發熱身痛目赤用敗毒散二日微汗而熱不退延至六七日身發稠密赤斑狂亂譫語聲變北音發則不識人似屬陽明熱證但脈細如絲而弦緊口雖干而不渴有議用涼膈化斑者余以脈為主作時疫陰斑亡陽危證幸程至飛團弘春定議僉同主以真武理中合劑重用參附者五日陽回斑散始克有生此余致恭同道冢媳因自如醫故弗疑而治效也吳李履兄庚午七月間得傷寒初不知其病狀至半月後始延余治診其脈弦而緊噦聲越鄰舌苔灰黑胸發紫斑結硬而痛臍旁動氣大便利水詢其何以至此答云初醫說是傷寒不效又醫說中暑進香薷飲二劑遂變至此仍欲用化斑湯未敢煎也余曰此陰斑也因冷極於內逼其陽於外法在不治幸神氣未昏手足未厥初劑用四逆湯加茯苓半夏吳萸溫里以治噦次日加人參以培陽六劑斑散利止惟嘔噦胸結不開仍用前劑不加增減半月後胸開痛止方用白朮理中計用參斤許附子斤許兩月方起床貽害至今遇病必須姜附又令媳汪宅未出閣閨女甲申春月感寒喉痛浙醫稱火遂恣食水果飲冷傷肺致增咳嗽因不溫散咳甚則吐血又易一醫竟認陰虛用生地黃二冬二母元參等藥更加生藕汁半鍾令其冷服服後即嘔吐不止氣塞喉中急以咳嗽吐血求治於余及診其脈沉弦而緊搏手甚緊余曰豈愚我乎此脈乃沉寒痼冷未經溫散直入於裡其證必惡寒身痛胸中阻塞嘔逆喉痛問之果然諸證皆備余曰此當表裡雙溫逼寒外解遂用桂枝細辛赤芍附子乾薑吳萸半夏桔梗甘草二劑喉不痛亦不嘔矣如斯六日寒邪出表發寒戰微熱微汗邪從外解胸塞咳嗽皆減能食米湯矣彼畏熱藥遂中止旬日後因前汗未周遍身疼轉為痛痹仍以前方去吳萸桔梗加當歸木通服七八日痛減未痊又畏熱藥而止半月後余寒內搏腹肋大痛呻吟不絶蓋因吐血時值行經服藕汁冷藥經因冷阻故當經期遂致大痛復用前方加肉桂五靈脂去細辛木通六七日瘀血下而痛旋減又畏熱藥中止留痛經餘證至今未除方安止郡丞素虛寒脈本細小丙子年初冬因酒後蓋覆不周感寒嘔吐次日即發熱惡寒身痛脈浮猶有表證作太陰病治法用桂枝蒼朮炮姜二陳等藥溫里解肌得汗表解旋入少陰脈細如絲舌黑下利尿如煤水因病重又請一醫參治見舌黑而滑作腎虛用八味地黃湯加人參甫一劑即嘔吐半夜而增厄逆因吐汗多遂致亡陽筋惕肉瞤大便頻下神昏蜷臥急以真武湯換乾薑每劑人參五錢附子三錢日服三劑如此十日未少間斷方得神清利止幸天生胃氣能進粥食計用人參三斤姜附二斤醫治兩月方獲痊可又令郎年十五歲因夏月貪涼食冷致仲秋發熱腹痛初幼科醫治十日不效令余接醫診脈弦緊仍以童稚治法用溫中化滯蒼朴桂枝炮姜又四五日亦不效以手按其痛處則在臍旁季肋之下此少陰部絡且年已十五不可作童子醫矣已經汗而熱不退每日大便而痛不減漸增煩躁此內真寒而外假寒少陰病也用茯苓四逆湯暗投附子恐病家之疑畏也初煎服下即熱退再煎擠渣服即安臥次日直告明用附子照前藥遵原方加人參一錢如此七日熱退痛除即轉咳嗽前之季脅痛處變為不能著席而臥蓋前痛乃外寒客於少陰今之咳嗽則因病而內虛寒改用八味地黃湯加人參十數劑咳止方能側臥病後唾水仍以八味地黃丸兩倍桂附水疊為丸服年餘乃唾止江豫臣兄戊辰夏病初屬周醫治療五日後相招脈則弦澀身無大熱惟胸中飽脹嘔噦不息前醫用柴平湯不效一醫用枳實理中亦不效余詳辨之病似太陰而多身熱又不下利面目皆黃又似陽明而尿不赤脈不長口不渴蓋弦脈屬肝澀主血病夜則獨語胸腹皆痛豈畜血證乎未敢遽投桃仁承氣先作厥陰畜血以桂枝赤芍炮薑半夏陳皮甘草日投三劑胸中遂寬至第三日竟屬厥陰少腹急痛不及登桶便下紫黑血塊半盆隨昏暈大汗尊堂慌迫以人參兩許煎湯灌下余急往診脈則散大此氣隨血脫也頻以人參湯進之方汗斂人清立候前治周醫告之曰傷寒蓄血已下略去傷寒二字惟有固氣一法周醫首允復同驗舌舌則全黑議用人參五錢白朮三錢附子炮姜各二錢甘草一錢不易方者半月舌黑全退飲食大進幸血下之後不復再便議去附子者三日舌復全黑加入附子旋退計服參附藥匝月方瘥黃庶常翁令政年近四十於五月初旬惟熟睡不醒呼醒又睡胸背脹痛嘔吐不能食不知何病招余診視脈沉細緊滑惡寒足冷以前病論之此少陰中寒而兼痰飲也經曰少陰病但欲寐此證是已諸陽受氣於胸中轉行於背今胸背脹者寒痰冷氣上參於陽部幸未厥逆急以四逆湯加半夏茯苓日投三劑計用附子七錢五分服至七日即霍然起矣黃迪人兄令眷為方星垣兄之令愛也夏月畏熱貪涼過餐生冷八月初患午後發熱腰疼腹痛大便頻瀉咳嗽帶血先醫數位皆主陰虛病經半月招餘一診主以肺寒咳嗽而用桂枝炮姜與諸醫藥不合置而不用逾半月病劇又增嘔噦喉痛煩躁不寐方宅令其復請其脈弦緊前病屬厥陰今病將入少陰矣而病家素畏熱藥病已至此亦難顧忌以桂枝細辛附子乾薑赤芍半夏吳萸木通桔梗甘草薑棗為引表裡兼溫服至六七日喉全不痛得臥躁寧瀉亦大減少陰病衰仍歸厥陰現寒熱混淆之證尚咳嗽而不吐血或小便不通而痛不可解服厥陰之烏梅丸則通或兩乳腫痛欲裂以當歸四逆湯加柴胡而乳消如此上下游走而痛者又半月皆以當歸四逆湯加附子乾薑茯苓半夏兼用烏梅丸以治諸錯雜之邪蓋始病皆未以傷寒治之致寒邪伏於厥陰不能外解計服桂枝姜附藥四十日裡氣方溫發出周身大瘡如豆磊磊然痛楚不堪計又半月邪漸解而瘡漸愈醫治兩月方能舉筋而食蓋厥陰主血經云厥陰病不解必發癰膿者此證是也吳象採太學令堂年近五十春間得傷寒初不知病狀經歷四醫至四十日始迎余治診得脈沉而緊按之甚堅全無和柔胃氣嘔吐發厄胸結如石舌黑而滑渴欲冷飲而滴水不能納詢其治法初則發表繼則解肌皆不效後浙醫包治先用黃連枳實後用大黃芒硝惟下糞水反逆上而結於胸幸不煩躁下利厥冷猶為可治以生附子生乾薑半夏茯苓吳萸大劑與之始能下咽亦不覺辛辣如此五日胸前稍軟而下痛於腹矣余曰此病必原胃冷誤投涼藥若陽病結胸豈堪此大辛大熱所以黃連大黃閃爍至堅冰今得溫劑冰化為水將必洞泄勿謂熱藥致瀉乃前黃連大黃未動也倘利瀉不止仍屬死證至七日果大瀉不禁其家以余先言竟備終事急用人參二錢合理中湯一劑入腹片時即止矣續以理中湯調理一月而瘥原籍山西胃氣本厚病餓四十日誤治不傷而人參一劑即應所謂有胃氣則生此證足徵矣葉奉宇媳丁氏孕三月惡寒嘔吐腹痛下利前醫作霍亂治至第三日腹痛而厥者三次回蘇則喉無音而竟啞前醫辭不治其母迎余診其脈尺寸皆伏惟寸口尚應指余曰此少陰寒證腎脈循喉嚨散舌本經云腎氣厥不至舌今寒極於下陽氣不升致喉無音惟救病人不能顧胎矣病家唯唯遂以四逆湯加桔梗大劑灌下片刻音出再劑痛止手足回溫脈亦漸出第五日果胎墮而産母無恙若徘徊瞻顧産母不救而胎何能獨存乎許蔚南兄令眷暑月因食瓜果得夾陰傷寒至第七日迎余往真州時當酷暑診其脈數大無倫重取無力乃虛陽伏陰之脈煩躁席地而臥者五日矣身發赤斑目赤畏亮口渴頻欲冷飲復不能飲前醫不識夾陰誤為中暑投以香薷以致陰極似陽余因其懷孕六月姜附未敢即投初用溫中平劑又屬女病不能親視病容唇舌脈大而虛亦似暑證恐熱藥傷胎先以井底泥敷臍以試其里之寒熱便投溫劑甫以泥沾腹皮即叫冰冷入腹而痛急令拭去余曰此真病狀也遂用茯苓四逆湯茯苓三錢附子二錢乾薑人參各一錢五分甘草五分令煎成冷飲余方撮藥病家驚畏而哭謂人參附子盡劑也倘不效奈何有孕在懷即藥效胎將奈何余曰經云有故無殞有病則病受不傷胎也正在遲疑吳中璧兄曰此吾女也年少可再孕接藥加參煎成立令服下五日未寐之病人得藥便睡醒則登床再劑斑消熱退熟寐半夜次日余辭曰藥效矣病未除也尚須藥六日倘畏熱豫告去矣病家云藥雖效而附子乾薑必致墮胎汝去誰為先生任過耶因留七日每日人參五錢附子四錢乾薑白朮三錢甘草一錢服六日胎不墮而病回後足月産一女今成育吳云翼兄秋杪赴席夜歸已寐半夜後寒戰嘔吐汗多次日微發熱他醫作陽證傷寒用汗法汗後熱愈甚反增身痛腹疼三日後就診脈細緊身無大熱因思酒後已寐而病作寒戰不熱嘔吐汗出此病從中發寒邪在裡不在表也因藥汗出而身反疼豈非誤汗乎初以桂枝理中湯解肌溫里二日不效至夜即轉少陰而現亡陽煩躁狂呼撫幾而立不能臥床少腹急痛肉瞤筋惕兩足厥冷急用四逆湯加人參三錢夜投三劑至四鼓方躁定登床得寐次日夫婦悲泣畏死余慰曰昨夜應死今日不死矣改用真武湯加人參二錢六日後方能坐於床後用理中湯加減調治半月方愈治病須意會表裡陰陽此寒霍亂初治即當用理中湯者吳駿聲大行令政因經行半月不止腹痛相召至診其脈則弦緊也豫曰此非血虛之脈必因經血虛而寒襲之也其證必頭痛身疼發熱嘔逆詢之果然初以桂枝細辛當歸赤芍炮薑二陳之劑不應邪因藥發漸增寒熱頭痛胸膈脹滿嘔噦不食脈猶弦緊全見厥陰經病用當歸四逆湯加乾薑附子半夏表裡雙溫續續微汗表解因經行既久血海空虛邪乘虛而入血室夜則妄見譫言寒熱混淆胸中熱痛口乾作渴小便澀疼煎劑用當歸赤芍桂枝木通吳萸附子乾薑人參甘草兼服烏梅丸三十粒以治煩熱便痛錯雜之邪隨病機之寒熱而圓活治之兩月後經水再至方脫然而愈吳隱南主政尊堂因大勞後得時疫初病但發熱身痛胸脹作嘔脈弦數外無表證此邪從內發所謂混合三焦難分經絡者也用芎蘇飲疏解之至第三日兩頤連頸腫痛此邪由太少二陽而出正合敗毒散證服二劑邪不外解次日反內陷而入少陰變為胸脹嘔噦煩躁不寐因病增劇日請數醫皆用柴胡蒼朴半夏青陳皮枳殼余雖日到而診視者五人藥劑雜投余不能肩任至第九日脈變細疾煩躁下利乾嘔胸滿令汗自出遂直告隱南曰病危矣不知連日所服何藥已傳少陰將致亡陽若不急救明日即不可治遂立方立論用茯苓四逆湯茯苓三錢附子二錢乾薑錢半人參八分甘草三分留藥為備卷以俟衆議其日曆醫八位皆曰不可服延至二鼓病人不躁忽變為笑矣隱南和笑為惡證勉煎服半劑即安睡至四鼓醒索余藥盡劑服之又熟睡至天明再請不準服四逆之醫又云當服矣但造議宜減附加參病家崇信減附一半加參一倍甫下咽即煩躁乾嘔急復相招竟去人參而加附子隨即相安蓋寒邪在少陰重在附子其加人參不過助正氣耳終竟去人參以俟邪盡六日後方甲人參理中湯加半夏彌月乃安病九日而傳變三經醫不明經何能治病黃蘭孕翁令政年五十外壬午隆冬病傷寒初不知何經受病至第八日請治脈則細緊而弦嘔噦痰涎神昏但寐腹痛下利足冷舌灰時發譫語先治之醫猶用蒼朴柴苓湯作協熱下利治指譫語為實熱余曰病經八日正陽盡入陰之時已經發汗消導而神昏下利將至亡陽急用四逆湯以救其逆安敢再肆疏削乎撮附子乾薑茯苓半夏甘草一劑而別前醫阻撓不決置藥不煎至夜病劇卜之灶神神允余藥方敢煎服服之即得寐醒後神清次日再招相信委治診脈稍和即以前藥加人參一錢日服二劑至五日噦利方止繼用附子理中湯半月始愈吳景何翁素有痰飲吐證每發不能納藥例以吐儘自止即醫用藥亦置不煎其年秋涼夜飲受寒歸家嘔吐繼即發寒熱相招診視余曰非夙疾乃新感寒也但本體虛冷不同常人治法用調中湯桂枝白芷蒼朮乾薑半夏陳皮甘草等藥溫經散寒雖日相招竟不服藥延至五日余激曰今日再不服藥寒不外解內搏於裡必下利不止矣猶然不信逮至初更腹大痛遂下痢膿血方以余言不謬連夜再招急請治痢余曰非痢疾乃寒邪五日不外解傳入厥陰肝經肝藏血寒搏血而下痢若以痢疾治則誤甚矣因其身熱未退邪猶在半表未全入里以桂枝細辛生薑解在表之邪以乾薑附子吳萸溫里之冷以當歸赤芍紅棗和厥陰之血日投三劑至第三日壯熱半日得通身大汗隨即熱退而痢止若誤作痢治身熱而痢豈不殆哉吳佩六兄由歙暑月到揚路受風邪脈浮弦滑頭疼身痛寒熱而嘔初一醫用桂枝細辛乾薑附子作厥陰治失之過重繼余往診作風暑夾食以柴葛平胃投之因而大汗殊不知風暑之汗不足畏也浙醫曰汗多亡陽誤治之矣急用人參黃耆斂汗勸其進食六七日邪不解日晡寒熱又作瘧治用人參何首烏截瘧復增泄瀉矣此景何翁之堂弟也復招余治雲系代彼里中覓地家中妻子多人倘不治關擊匪輕切囑甚力余曰此陽明病須斷飲食方敢經手病家唯唯復用十日前柴葛平胃等藥因服首烏而作瀉加入炮姜寒熱漸輕五日後積滯頻下七八日霍然而起病者笑曰省用人參銀數兩矣君榮族叔居鎮江年三十外夏月患傷寒初不知何證服京口醫家藥發汗過多即小便難出又用五苓散服下旋通旋閉點滴難出少腹脹滿頭汗時出迎余渡江脈虛大而遲坐不能臥氣微促不小便者三日矣余曰此誤汗亡陽非大劑人參不能救時京口老醫黃石倉適至余與彼兩議相同遂用人參一兩茯苓三錢附子一錢服下合目片時略有尿意又進一劑微滴夜又一劑五更則頻頻而出遂不禁矣次日再以理中湯加茯苓益智仁調治半月而康後七年中暑而病尿又不通力薄不能市參終至不救蓋此人縱欲腎氣大虛每病必攖此患瓜鎮侯公遴深秋傷寒始自以為瘧飲食如常寒熱漸甚至七日方迎至則陽明證矣服藥五日漸變神昏譫語胸腹滿痛舌乾不飲水小便清長轉為畜血證遂用桃仁承氣湯下黑血碗許即熱退神清次日忽小便不通猶有點滴可出用五苓不效乃太陽藥也病者素清癯年近六十脈細而澀此畜血暴下陰氣必虛經曰無陰則陽無以化原病陽明畜血仍用陽明之豬苓湯湯用阿膠是滋陰血者也以本方豬苓茯苓澤瀉滑石阿膠而加桂枝芍藥以和營血甫一劑小便如湧泉矣方倫遠兄族弟年未二十自歙到揚秋杪傷寒先為揚城某醫所治至八日迎余診得脈弦而細身微熱足冷嘔逆胸滿咳嗽喉痛而吐血水腹痛下利陰莖內痛而尿血夜則譫語此證陰陽錯雜寒熱混淆乃厥陰經病也檢前醫之中乃柴苓湯也辭不治病人泣曰我孤子也家有老母乞憐而救之豫曰此厥陰經病宜表裡兼溫使邪外解前醫不識邪氣內搏故嘔噦下利厥陰主血邪搏血故上下皆出用藥與前醫天淵必須桂附如不效必歸怨於熱藥矣倫遠答以大數決不歸怨遂用桂枝細辛當歸赤芍乾薑附子木通桔梗甘草薑棗為引解肌溫里以治身熱喉痛腹疼下利外用烏梅丸以治嘔噦吐血尿血而祛寒熱混淆之邪余以一念矜憐遂忘旁議不意竟以湯丸二藥堅治半月而獲痊病起方初冬而病者日已圍爐烘足設以吐血尿血為熱證豈不殆哉汪方伯潘姓紀綱寒夜隨赴席食席余冷物五鼓回家即腹痛作瀉次日早辰則喉音頓啞外無他證手足不冷但脈沉細耳靈樞經曰寒中少陰卒然而啞因腹痛瀉利後隨啞脈又沉細全屬少陰無疑矣初用麻黃附子細辛湯一劑則有喘汗之意其身不熱寒不在表而全入於裡易用四逆湯加桔梗服二日脈方略起計每日用附子七錢五分至第四日猶喘厥片時醒得微汗其音始出黃成九兄未出室之女壬戌冬杪小便後卒然而啞豫作少陰中寒用麻黃附子細辛湯其時某醫畏熱不用後七八日竟至不救附記方純石兄五月初兩頤腫痛先為瘍科所醫外敷內服不知何藥至八日見招腫勢將陷寒勢交作余曰此時行之蝦蟆溫也用荊防敗毒散二劑表熱隨退腫消大半不虞少陽之邪直入厥陰脈變沉弦喉痛厥冷嘔吐胸脹改用當歸四逆湯加附子乾薑吳萸堅服三四日得微汗喉不痛而嘔止脈起足溫尚有微腫病家以為愈矣次日往看腫處盡消但笑不休問其所笑何事答曰我亦不知脈復沉細舌有灰苔已笑半日矣追思初病必服涼藥所以少陽傳入厥陰厥陰不解又傳入少陰少陰寒水上逼心火心為水逼發聲為笑不早治之將亡陽譫語不可治矣幸孫葉兩醫以豫言不謬遂用大劑四逆湯加人參三錢服後片時略睡須臾醒即笑止一晝夜共服三劑次日腫處復起仍用當歸四逆湯加附子乾薑三四日腫處回陽發癢起皮而解其時有不解事者謂豫多用姜附而致狂醫難用藥有如此夫又令眷隔十數日兩頤亦腫而不痛若屬少陽則脈當弦數身熱今脈弦細身不熱亦屬厥陰始終以當歸四逆湯加附子乾薑治之服至半月方從外解發熱脈浮身發癮疹作癢而愈彼因未服涼藥故不致內陷嘔吐逆冷而傳少陰發笑也時行蝦蟆溫一證稽之前賢治法皆主少陽而用辛涼並無傳經之說然虞天民醫學正傳謂喉痹證不可遽投涼劑恐上熱未除中寒復生變為發喘不休將不可治又陳若虛外科正宗亦云饑年毋攻時毒夫饑年指正氣虛也即此二說則前賢之發明久矣邵子易兄四月間自江右回揚素有中寒痰證數日腹中微痛漸次痛甚先醫者已用炮姜附子蒼朴溫消繼用六君子加香砂作太陰寒治而痛益甚迎余往診其脈沉細而緊汗出沾衣面赤腹痛腹形脹大乾嘔欲吐小便頻數大便下利少陰證全此因前之蒼朴耗氣繼用白朮閉氣是以不效也但久痛傷氣須急扶陽不宜疏氣以附子乾薑為君肉桂人參為臣吳萸甘草為佐用生附子三錢人參乾薑二錢肉桂吳萸甘草一錢日三劑三日後減一劑又三日痛止而愈瓜鎮趙姓傷寒半月餘前醫發表攻裡俱備已經兩下心下痞硬腸鳴下利乾嘔心煩形容瘦削六脈沉細前醫辭治其母求救豫曰胸痞硬而不痛非結胸也因兩下胃而氣逆故痞硬惟溫中瀉實一法可施以甘草瀉心湯主之用黃連乾薑甘草半夏大棗二劑知六劑即效蓋前治之不如法所以易效也方誕初孝廉盛暑患咳嗽吐血午後發熱腹痛作瀉病四五日自以為虛損覓廣三七治吐血招余參治診得脈弦細而緊舌紫苔白兩足冰冷咳嗽血涎余曰此厥陰傷寒非虛也乃恣食生冷畏熱貪涼寒中肝經肝主血此厥氣上逆而吐血涎形寒飲冷則傷肺肺寒則咳冷飲注於下焦則腹痛下利擬用桂枝細辛赤芍附子乾薑吳萸半夏茯苓甘草呈方令尊翁未敢用藥因藥太辛熱不合病狀故也幸其令嶽主持方敢投劑服至三日則得汗而熱退再四劑咳瀉亦寧而陰莖內痛兼服烏梅丸煎劑減去吳萸加當歸木通合當歸四逆湯又兩日小便旋通七日後步行於途矣仙柯族侄秋杪內傷生冷外感寒邪形盛氣虛中宮素冷即腹痛作瀉嘔吐發熱里證多而表熱微余初作太陰治用蒼朮炮薑桂枝二陳香砂之劑畏余藥熱易醫用柴苓湯至十日寒邪直入少陰漸變神昏不語默默但寐腸鳴下利足冷自汗筋惕肉瞤復召治療病勢已危主用真武湯加人參乾薑回陽固脫衆醫議論不合惟秦郵孫醫以豫不謬令祖曉齊先生主持堅托余醫遂以真武湯本方加人參三錢乾薑二錢附子三錢日投三劑汗瀉稍寧其時令嶽母曰藥則效矣奈熱不退何余曰此證以身熱為可治若不熱則厥冷下利不止矣故餘留熱醫也照上藥服至三十劑歷一旬始省人事筋惕下利方止詢其前事全然不知後服理中湯匝月方起蓋少陰病以陽為主熱乃可治也吳非昨表侄初夏喉痛瘍醫不辨寒熱用黃連四劑喉痛止而變嘔吐脅肋大痛三四日不進米飲矣令尊若翊兄急迫商之於余診其脈弦細而緊此厥陰吐逆外科謂之過關喉痹因誤用苦寒直折痹下結於胃口矣先用烏梅丸三十粒以開其寒熱格拒之邪日進三服至夜吐止而能納食矣即轉腹痛手不可按此上焦之寒下注於中焦急用四逆湯加桂苓人參日進四劑服附子一兩如此六七日腹大痛方止尚微痛作瀉後乃若翊兄自行調治而愈喬揆文兄令眷年近四十夏月畏熱喜涼以水漬巾披身瓜果無忌初胃中脹痛手足痠麻作嘔欲吐余初診脈細緊無力言系中寒停冷之病因脈細緊用六君子湯加桂枝乾薑旁議盛暑安得用此熱劑易醫服藥聞用蒼朴二陳消導之藥治經九日病劇復招則寒直入少陰乾嘔煩躁脈緊近疾腰痛似折常以滾水漬巾尉之冷則又易氣塞喉中水飲不納甲紫舌黑骨寒而痛病勢危篤余曰陰極似陽陰陽格拒若能納藥方可治療先以半硫丸一錢開其格拒之寒服下不吐繼以生附子生乾薑各三錢半夏茯苓二錢吳萸一錢頻頻灌下方嘔止躁定遂換熟附減藥如斯九日諸證皆退遂改用理中湯加人參一錢溫補五日忽然嘔吐血水病家雖不言而意謂前之姜附貽害也余曰始病太陰中寒脈既無力則宜溫胃誤用消克以致傷陽陽消陰盛致傳少陰少陰得溫轉屬厥陰此由重致輕也但厥陰寒勢錯雜忽陰忽陽纏綿時日耳旁議疑信相半遂多延衆醫有醫竟認陰虛而用地黃者有醫見余用桂枝吳萸遂收箱不用藥而去者惟孫其猶亦主厥陰用當歸四逆加附子吳萸於是病家不為他醫所惑余得盡心治之皆以當歸四逆湯用桂枝當歸赤芍半夏茯苓吳萸木通甘草薑棗為引兼以烏梅丸治其假熱如此半月漸次嘔止而血亦不吐矣病愈多勞遂脈轉數內熱咳嗽而吐血左脅不能臥竟有陰虛咳嗽之機蓋厥陰風木內藏相火乙癸同源暫用六味地黃湯以滋化源且服辛熱藥一月有餘陰氣不無受傷不得不權機應變服半月熱退嗽止脈亦不數虛熱方退而中寒復生且值秋杪霍亂吐瀉大作胸腹脹滿脈來細緊溫劑難投惟平調胃氣以俟其勝復半月方平再以參朮歸芍橘紅茯苓丹皮石斛平補半月氣血稍充餘邪外解周身發出癮疹作癢起皮蓋夏月水中之寒邪化熱出表也從前各證至此方除計治五閲月足徵厥陰病寒熱混淆不一邪氣出入不常若非病家信任之專或從證或從脈隨病變遷圓機施治豈能獲痊乎王汝振僕婦年近三十冬杪患頭痛以無發熱惡寒表證前醫遂以火治之至三日痛益甚頭疼如裂小便頻出無度豫診之六脈弦緊而細面赤如妝此厥陰頭痛也三陰惟厥陰有頭痛以厥陰之絡絡於巔頂也檢前方乃石膏梔子誤用苦寒致寒極於下逼陽於上面赤戴陽頭痛如破且婦人厥陰之絡內絡廷孔廷孔者溺孔之端也寒客內絡故小便頻數矣幸未厥冷下利邪猶在經用桂枝赤芍細辛生薑以解經邪用附子乾薑吳萸半夏以溫里冷日服三劑先出冷汗後出熱汗頭痛便頻隨止此藜藿之人裡氣不虛故邪易解也吳南皋兄家人年二十餘五月間得傷寒初系他醫所治至八九日忽發狂譫語躁欲墜樓其妻拉住揮拳擊婦致婦胎墮數人不能制用醋炭熏鼻方能握手診脈脈則散大無倫面赤戴陽此誤服涼藥亡陽譫語瞬息即脫衆藥陳幾有用白虎湯者承氣湯者柴胡涼膈者病家云因服香薷涼藥大汗至此故不敢再煎求余決之余辭不治主人力囑遂以真武湯本方易乾薑用生附子三錢令其煎成冷飲服後片時即登床就枕略睡片刻醒則再劑加人參一錢熟睡兩時即熱退神清詢其前事皆云不知繼用理中湯六七日而愈其婦因擊墮胎而反殞郭元威學博令政平素虛弱正月杪夜發寒戰寒後發熱次日招診脈細緊而近於疾其證發熱頭疼左脅痛甚上至臂下至腰足皆牽引而痛乾嘔胸脹因脈沉細作厥陰病主治用桂枝細辛赤芍附子乾薑半夏茯苓吳萸木通甘草薑棗為引四劑上身微汗痛減而下體痛甚因向有腳氣證加獨活至第五日有出少陽之機以前劑稍加柴胡令其微汗不虞親屬覆以重裘逼汗大出雖熱退半日至夜即煩躁不寐呻吟不絶胸中大熱欲飲冷水暮夜再診脈變數大無倫重取近散此汗多亡陽也急以茯苓四逆湯救之用人參三錢茯苓四錢附子二錢乾薑一錢甘草五分一劑稍安二劑得寐一夜三劑至天明熱退而安隨增咳嗽半身不能側臥此又屬肝腎陰虛傷寒病後每多此證若認少陽而用柴胡二陳蘇杏必致不救仍以前厥陰為主病用桂枝當歸白芍茯苓附子甘草人參五味子薑棗為引十數劑咳止可側臥矣半月後緊脈退盡方去桂附以歸芍參朮苓草平補而愈吳方平表侄冬月夜飲歸睡後有脅作痛初系浙醫作少陽治法以柴胡白芍青皮貝母香附等藥治之七八日痛愈甚至夜坐不能臥者三日矣招余往治脈沉弦而緊足冷畏寒胸滿不能食脅肋皆痛不能著席而臥舌紫微喘余告曰此厥陰傷寒厥氣上逆不得臥而喘病關少陰若增煩躁下利則全屬少陰不可治矣今並無少陽寒熱頭眩口苦幹嘔脈弦數等證何得以少陽治之遂用官桂赤芍吳萸附子乾薑半夏甘草溫經以下厥氣服至七日方回陽發熱微汗痛止喘定就枕得臥而痊若作少陽治法不知作何景狀也汪文年兄冬月傷寒初診脈沉細緊少腹背皆痛外證反發熱頭疼余曰此陽證陰脈法當難治應以脈為主作厥陰病治法不用表散惟主溫經用桂枝細辛赤芍附子乾薑吳萸甘草生薑服三日得微汗頭痛表熱盡退腹中尚隱隱而痛如此六七日胸中亦不飢惟進清米飲脈亦不甚起正為可慮蓋以厥陰不回陽外解邪搏於裡恐轉少陰而變下利也至夜果腹痛下黑血數碗即眩暈汗出次日往診脈仍如前之細小未因脫血散亂幸前預用桂附溫經故不致氣隨血脫彼之尊人十數年前夏月病此醫作暑療血下隨脫病人恐甚急用真武湯日投三劑每劑加人參四錢附子三錢茯苓乾薑白朮各二錢赤芍一錢幸下血之後更不再便如此大劑七日後方減參附加甘草合理中湯調治一月而愈汪次履兄年逾二十夜寢發寒戰而醒戰後發熱次日迎診大熱肩背皆痛但頭不疼而面赤脈亦浮大惟重按無力腸鳴欲便知為夾陰傷寒用桂枝炮薑蒼朮赤芍二陳兩劑次日再診各證俱減照前留藥二劑囑其一日全服勿進飲食少年畏藥只服一劑更因便通熱退遂食飯行走兩日不藥至三日其病復作大熱身痛足冷呻吟不息胸中氣塞口中臭氣逼人自云吐痰亦臭脈細沉緊此乃病中不慎復傳少陰矣蓋府氣本於腎脈既細緊斷非胃熱腎藏寒邪逼真氣上出於口亢害之證初病已汗已便今病復作何得旋有實熱此為少陰身熱可知用茯苓四逆湯加桂枝半夏溫里解肌如此六日熱退便通口亦不臭但裡寒未解腹痛便溏不思飲食仍用薑附桂苓人參半夏甘草六七日方能起坐計服參附桂苓理中湯三十六日因事勞輟藥一日即寒戰厥冷倍用參附方回又溫補半月乃健若因口臭遂為胃熱不幾大誤耶汪象成兄令眷年三十外素有肋下臍旁寒積每發必痛吐痰飲非一日矣乙酉年初秋復感外寒而舊病同舉初不以為病醫者亦以姜附輕劑治之至第九日病勢沉重路截邀治則兩尺脈全無嘔厄不已手足厥冷氣塞喉中耳聾神昏下利豫曰病劇矣此少陰證也非重劑不能回生先以半硫丸治厄繼用生附子三錢乾薑半夏茯苓各二錢吳茱萸五分日投四劑雖未變壞陽總不回如此三日隔牆廚內烹雀彼忽知之急索欲食豫曰此真陽飛越將亡陽矣急用四逆加人參藥未熟即大笑不止隨即服藥而狂呼揮拳亂毆猶甚急服再劑方寧而寐次日問之全然不知若非知機急救豈不亡陽而逝哉繼用四逆加人參桂苓半夏日投二劑月餘方陽回利止復冷祕吞半硫丸十日大便乃通皆稀溏糞水因臍旁動氣始終皆屬前方若加白朮理中湯便脹痛不已以動氣禁用白朮也汪其暉兄秋夜深坐遊湖食冷遂致胸腹不寬日日大便無寒熱身痛諸證自以為停食而前醫猶用香薷延至第三日邀豫便診雖不出門猶堂前會客其脈濡細帶緊此寒中太陰宜溫中斷食余用炮薑桂枝蒼朴二陳等藥病人全不介意日惟服藥一劑間日再診脈變弦緊以危言告之彼方不食其夜則嘔噦腹痛身熱大困矣此太陰病不解而傳厥陰改用桂枝乾薑吳萸赤芍半夏苓草立有厥陰病案預言防下利因前醫用香薷故未即投附子其內親吳煥若兄密加附子入藥噦遂止隨腹痛下利膿血日夜二十餘次病家以為痢疾余告曰此厥陰病下利膿血也若作痢疾處治而用香檳則不救矣即以當歸四逆湯本方加乾薑熟附日投二劑每夜通身微汗次日利即少減如此七日藥不易方七夜皆汗而利止矣此厥陰外解證也後以脈細緊未退仍用前方去乾薑吳萸至十餘日大便方通飲食可進而愈綏遠族侄八月杪步至豫家就診自稱病瘧求治蓋前醫之言也及診脈則沉弦緊而無力豫曰何輕視之此厥陰傷寒也必手足微冷寒而不熱少腹隱痛腰腿冷疼有是病否應曰均有之視其舌色紫無苔即投桂枝細辛赤芍半夏熟附子乾薑甘草次日往診則手回溫脈不沉而但弦緊少腹隱痛下痢血水而增嘔矣此厥陰內搏之證遂全用當歸四逆加吳萸附子七日出表發熱煩躁汗出而解進粥食矣被友拉出門巷語多時受冷而勞次日脈反彰大身熱腹痛下利足冷胸滿作嘔仍用前劑則汗出脈陷其細如絲證轉少陰遂用四逆湯加人參肉桂茯苓如此不易方者半月方得利止脈漸出便實而愈前汪病案乃太陰傳厥陰里不甚虛仍從外解此初病即屬厥陰得溫里法亦外解矣因勞而復裡虛遂傳少陰少陰無外解之理所以直用溫里而愈此傷寒表裡之大關也張其相兄家女婢年十五歲初冬得病因循未服藥延至四五日頭疼身痛微熱惡寒氣塞喉中嘔噦不納藥脈沉細緊浙醫認頭疼為太陽因脈沉而用姜附雜以羌防白芷蒼朴不能下咽次日無可奈何改用柴葛平胃以試之不得效迎余往診而前證具在豫曰此厥陰表裡齊病宜用溫里但陰寒上逆竟成格陽矣先用烏梅丸二十丸以通其格拒嘔止能下藥隨用桂枝細辛乾薑熟附吳萸赤芍半夏赤苓如此四日兩得微汗表證皆除惟骨寒痛未減至五日即入少陰下利五次徹夜號呼齒皆枯垢鼻有煙煤手足厥冷脈微欲絶脫陽見鬼擬其夜必死但形神未脫憐而救之遂用生附子五錢乾薑三錢茯苓甘草各二錢一劑手溫再劑利止脈亦微出如斯重劑七日方獲回陽而愈若以人賤忽之必無生理矣程靖宋兄就診於親家李宅尚能強步但稱左脅痛甚已四五日矣診其脈弦緊而細兩手清冷面色純青咳嗽則痛引頭脅此寒中厥陰肝經須溫經散寒痛方得止用桂枝細辛當歸赤芍吳萸乾薑半夏甘草二劑痛減再劑加附子遂大汗而痛除又二劑又汗而痛全止但少腹微痛似動氣之狀三四日通夜不寐幸不煩躁脈則細澀無力此必因兩汗亡陽而不寐也仿大青龍誤汗法用真武湯去白朮加人參當歸易炮姜加肉桂收陰攝陽如此五六日方能熟寐而愈此乃厥陰病惟用桂枝細辛尚汗出亡陽幾至危殆若少陰誤汗更當何如哉瓜鎮卞祥生七月外感內傷午後潮熱天明汗出而解前醫誤認陰虛更勸其加餐肉食至七八日食塞胸中藥飲難下招余往診其脈細數儼似陰虛重按則滑而有力此外感輕而內傷重也用仲景瀉心湯法以柴胡解外之晡熱以黃連乾薑半夏枳實瀉胃中之濕熱但中宮膠固恐發厄則難治其夜果厄次日更加乾薑七八日胸次方開食滯出胃然後以小承氣湯兩下而愈計斷食十二日蓋此證脈細乃食結中宮下午發熱乃陽明內實五更盜汗乃濕熱熏蒸三證非虛而是實若以脈細誤認為虛不以滑而有力為實熱豈不再誤耶行九族弟夏月得傷寒初醫者不知何藥至第八日招診脈大而數按則無力身有微熱煩而不寐者三日矣云已發汗解肌消導皆不效相商議下余曰脈大為病進今八日已陽盡入陰之期而汗和不解脈反彰大此虛陽伏陰非溫不效用茯苓四逆湯溫里收陽彼不肯服延揚世醫決之彼云脈大面紅口中大臭乃陽明內實非大涼大下不解見餘四逆湯搖手而去又迎團弘春決之弘春曰陽氣外越裡實虛寒急服無疑猶不敢用余因族誼迂道復探則席地而臥煩躁不寧余曰病急矣若再不藥必寒戰大汗而亡陽矣令急煎藥坐視其下咽片刻面白合目欲臥扶其登榻再留二劑通夜服完次日脈斂熱退口亦不臭而手足反清就枕便寐全見少陰本證如此溫劑十日繼用理中湯半月方愈巴繡天主政隆冬檐際脫裘易近體之衣覺受寒尚不為困本夜又夢遺次日即寒戰頭疼發熱腰痛脈反細緊病屬陽證陰脈幸脈但細而不沉猶有頭痛身熱乃厥陰表證用當歸四逆湯溫里散寒以桂枝細辛赤芍附子乾薑半夏茯苓甘草薑棗為引因有急務遂晝夜四劑三更得汗五更即乘輿遠出自為無恙次日即飲酒茹葷三日回家午後又寒戰發熱更增嘔吐痰涎仍用前劑夜半得汗熱退而解次日又復乘船遠出於路寒戰發熱吐瀉腹痛而歸自稱瘧疾余曰非也瘧之為病必受邪於半表蓄久而發此證先日受寒次日即病脈不浮弦斷非瘧疾乃厥陰表證而兼里病也仍用前劑因增腹痛下利脈變細緊無力加人參以固里則寒輕汗少四劑寒熱下利皆減如斯三四日寒熱頓止嘔瀉皆寧姜附藥服至十二日退用當歸四逆湯本方去細辛而加參朮溫補匝月而康辛酉仲夏豫遷郡城之次年其時疫氣盛行因看一貧人斗室之內病方出汗旋即大便就床診視染其臭汗之氣比時遂覺身麻而猶應酬如常至第三日病發頭眩欲僕身痛嘔噦外無大熱即腹痛下利脈沉細而緊蓋本質孱弱初病邪氣即入少陰脈證如斯不得不用姜附人參以溫里如此六七日里溫利止而疫氣遂彰譫言狂妄胸發赤斑數點舌苔淡黃而生緑點耳聾神昏脈轉弦數此由陰而出陽必須汗解之證也病劇回真州諸醫束手不治適山紫家叔來探問數當不死余忽清爽細道病源謂非正傷寒乃染時疫緣本質虛寒邪氣直入少陰服參附裡氣得溫逼邪外發但正氣甚弱不能作汗今脈弦耳聾邪在少陽乞用小柴胡湯本方加人參三錢必然取效山紫家叔遂照古方一味不加增減而入人參三錢一劑得寐再劑又熟寐夜又進一劑中夜遂大汗至五更次日即霍然矣繼服人參半斤始健戊寅年九月杪餘年六十一矣又染時疫初則巔頂微疼夜則兩腿痠痛次日即嘔噦午後寒熱似瘧而無汗解夜半熱退邪氣混合三焦難分經絡若六七日不得汗勢必要死預召門人熊青選授以治法而脈弦緊無常寒則細熱即數漫無專經惟以初病巔疼作厥陰病治用桂枝細辛赤芍半夏薑附吳萸人參甘草解肌溫里如斯五日病不減而增劇至六日中夜寒熱不得汗煩躁欲死與門人商之余非邪氣實不得汗乃正氣虛不能汗也以人參三錢生薑三錢仿露姜飲法試之煎服頗安渣再煎服有欲睡之機而胃中飢甚索米飲家人見熱甚不與余勉起床取糕數片索湯家人不得已與湯一碗將糕泡化盡食之覺胸中泰然就枕片刻即汗出自頂至瞳衣為之濕至五更汗方斂次日即全解矣經云汗生於穀良不誣也以此徵之時疫邪不傳胃不能盡絶穀氣上傷寒諸案皆屬三陰而關三陽者蓋三陽證顯明易見諸道中治無遺病即光所治亦無異於諸公特以亢害之證似是而非者令兒輩録存以示諸門人非略三陽也丙戌續案楊紫瀾兄夜勞不寐者屢日春杪猶寒致受夜冷直犯陰經初以受寒就診脈則弦緊惡寒身痛但微熱耳用溫經散寒藥二劑略減自不為意起居飲食如常寒未外解數日後內搏於裡肛門墜痛遂易瘍科作痔醫之延數日痔不潰亦不為楚即轉痛於季肋之後近腰軟處又作肝癰治之遂夜發熱煩躁作渴通夜不寐復迎余治脈沉緊而細兩足厥冷舌紫苔白余辨曰非癰也初病脈弦緊原屬夾陰邪在表裡之間因不治療傳至少陰肛墜而痛蓋少陰腎藏開竅於二陰也失之不溫今入腎之本位矣且脈不數痛處按之內無硬形外不作熱而痛肋反欲著席而臥其無實腫可知斷非內癰皆因失於溫里寒極於內逼陽於外所以夜熱陽既外越里必虛寒所以陰躁不寐下冷必陽厥於上所以渴而欲飲也今已手足厥冷脈已沉細若不急溫必加下利則難治矣而楊兄素惡熱藥奈病在厥少二陰之本非同陽證可以泛治不得不肩任之遂以官桂當歸赤芍乾薑茯苓甘草暗投附子二錢以防下利夜服一劑半夜安寢煩躁惟一刻耳次日又服二劑則熱退痛減再二劑痛止全臥手足回溫肛亦不墜矣如此藥五日即霍然而起續以溫補藥而痊此證與三卷張紫山小便頻數似痔之案相同汪靜夫兄五月初一真州得病服過羌防柴葛藥七劑初四日回揚揚醫猶以真州套劑治之皆前不效藥也令余壻朱與白相招診則脈沉而緊兩尺如絲汗多而熱不退頭疼身痛呻吟不能轉側煩躁欲席地而臥乾嘔欲飲冷水復不能飲舌紫無苔少腹硬痛以傷寒論之陽證陰脈法當不治因有頭痛定屬厥陰又多煩躁兼有少陰須兩經並治用桂枝赤芍細辛附子乾薑茯苓半夏甘草八味投之二劑躁定熟寐而身痛減半又四劑脈起不嘔能食米飲矣忽尿莖內痛小便黃赤乃厥陰陽回吉兆而旁人遂謂余誤用熱藥勸進燈心湯因停余藥延至午後即腹痛下利初硬後溏抵暮復加陰躁起床抱柱而立此真武湯證劈地就實之狀因便后里虛亡陽之機已露遂不從旁人之言仍煎余藥服後躁定而安臥至初七日清辰再診全屬少陰證矣脈沉細手足冷汗不止腸鳴下利兩腿筋惕急用大劑真武湯一劑至午厥回汗止猶有利狀遂加人參晝夜三劑計用附子一兩人參六錢方陽回利止因有身熱腰疼遠迎京口名家猶謂表邪未解里滯未清藥用柴葛二陳病人畏不敢煎然終以身熱為患余告曰少陰身熱乃為可治若厥冷則下利不止矣余所以留熱以存陽也竟服真武湯五日少陰病衰餘邪仍轉厥陰耳前時或一痛夜則氣上衝喉渴而多飲皆厥陰表證恐致發頤必怨熱藥遂以當歸四逆湯本方不加姜附少入人參以助正氣二日四劑周身微微似汗者一晝夜邪盡外解而口渴氣衝耳痛莖痛全愈矣因旁議紛紛除去薑桂甫五日即腹痛作瀉復用桂枝人參湯五日便實而痊續用平補藥十餘日因食蘋果又胸脹不食胃本虛寒豈余浪投辛熱今病已痊而附子之謗不息執膚淺之見妄論是非內經不失人情四字醫家誠戛戛乎難之矣吳西爍兄酷暑染病身無大熱但稱下體痠痛多飢欲食小便頻出下氣頻泄而不臭口中反穢氣逼人舌紫苔白自以為虛又疑為暑及診脈則弦緊而細皆陰脈也無經絡之可憑若謂口臭多飢為陽明而脈不長大無惡寒發熱頭疼全非陽證且不腹滿自利斷非太陰今脈弦細而緊心懸如病飢腐氣上逆清氣下泄舌紫便頻皆屬厥少二陰之病初病不暴者邪從中發其勢未彰乃時疫也因脈細緊用桂枝赤芍細辛獨活半夏乾薑赤苓甘草溫里解肌俾邪外出二劑頗安遂加附子服後一刻即周身皆麻病者畏停後劑三日後其邪乃發遂頭眩身熱煩躁作渴身疼腹痛脈仍細緊全現厥陰經證竟用前劑得汗數身邪氣稍解病者因夜煩躁令去乾薑次日即下利嘔噦易以溫里治法用附子乾薑茯苓半夏甘草四劑則熱退利止漸次則愈數日後食鮮雞海味即發熱腹痛下利膿血日夜十餘次脈復弦大而緊自稱痢疾余曰乃厥陰餘邪因復而下利膿血非痢疾也脈變弦大宜從汗解復用厥陰之當歸四逆湯加乾薑附子以溫里二劑大汗病遂減半四劑熱退利止次日忽陰囊腫大如瓜痛不能立稱舊疝復發余曰尚是厥陰餘邪甫離後陰又注前陰非疝也仍用前劑疝亦旋消因脈尚弦知邪未盡藥不易方二劑後周身皆麻如初服附子狀隨即手足拘攣頸項強直儼如痙證少刻大汗通身痙麻皆定余慰之曰可不藥矣病者但稱口渴胸中熱甚此厥陰逆上之虛陽令吞烏梅丸二十粒頃刻渴熱皆除脫然而解病家因麻痙驚駭延他醫診視不識病因但稱附子毒而已嗟乎殊不知初服附子麻者欲作汗也若不畏而再劑必大汗而解失此汗機使邪蟠踞於表裡之間入藏則利注經則疝出表則麻乃邪自里出表其病實解而反似危因始終未用苦寒裡氣得溫逼邪外解病復五日而三變證惟執厥陰一經不為利疝所惑此認經不認證也
