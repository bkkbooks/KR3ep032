body:
  text: 卷四女病治效劉振寰翁令眷己未年在揚患病其長郎劉必遠兄祈簽令彼問治於余遂至瓜鎮道其病源病人年五十外清癯茹素初秋因鬱怒遂胸腹不寬兩肋脹痛不食則嘈食則不能過膈間或吐出郡城諸醫皆以清痰理氣丁沉香燥治之愈劇漸至大便祕結數日一通每至黃昏即後重欲大便空坐穢桶不能起立又無糞下至五鼓方可登床如此四十日百藥不效困憊不堪坐桶時能食飲湯稀粥至登床後天明即嘔逆不能食矣余未診脈以意度之此肝火也先因鬱怒傷陰繼復香燥耗血致火上逆則嘔吐下迫則後重晝則氣升故吐夜則氣降故墜但病久氣血皆虛須用血藥以滋肝左金以折肝參草以補中定方立論用當歸白芍人參茯苓甘草黃連吳茱萸山梔橘紅令彼持回試之如大效再易方服二劑即不吐四劑即出下氣不坐穢桶夜可就枕再索藥即照前方服至二十劑即霍然起矣余初有移居郡城之意未果因彼再三諄請遷意遂決吳言修封翁夫人年近六十素有痰飲證發則脅肋大痛嘔吐屢日痰盡則痛吐自止乙亥首春痛吐已六日前醫以宣氣利痰為主用旋覆代赭石湯加吳茱萸乾薑藥皆不納第七日招余左右手六脈皆伏推筋著骨皆無水飲不能下咽似屬逆證而聲高音朗坐起如常無厥逆汗出等證此吐甚傷氣致脈全伏當以溫里為急用乾薑附子人參半夏茯苓各錢半吳茱萸五分一劑即下咽不吐再劑相安得寐四劑痛止但脈不出續進米湯三日後脈出如絲大進粥食脈始全見嗣後每痛吐脈必伏用前藥即效痛吐止後數日方能服白朮理中等湯而甘草竟不能入劑用則必嘔至壬午年四月痛吐數日不止因年增氣弱即痛引肩背欲食冷物畏亮陰躁以幔蔽窗有虛陽上越痛吐亡陽之機余每劑用人參四錢附子三錢薑夏茯苓各二錢而病者堅不服參不得已暗加人參大劑溫補三日方陽回躁定去蔽窗之幔不畏亮光嗣後常服半硫丸則飯食多餐而薑附之劑居恆不能久輟人之藏府虛寒此固世不多見者也孫思睿翁令眷壬戌年懷孕喪子悲泣過傷因而咳嗽自秋至冬漸至喘不能臥兩足水腫腹胎六月諸醫治咳分利罔效最後招豫水勢泛溢腹大如鼓其面反瘦脈細如絲兩尺全無此腎水也孕婦患水其胎必傷況兩尺脈全無胎已息矣宜急治其水以全孕婦惟金匱腎氣湯可救遂以本方加人參一錢附子肉桂各一錢如此半月水忽大下盡濕被褥流溢床下而腐胎隨墮其時氣脫昏厥令急服參附湯而穩婆諸婦爭論不肯煎蓋以揚俗産後禁用人參故也幸思翁自主推諸婦出房用大銚自煎頻灌半日半夜通服人參六兩附子兩餘夜半回蘇而余咳余水未盡仍用金匱腎氣湯一月始水盡咳止殷凌霄兄令眷年近年十體肥便血先醫皆用芩連涼血寒中之劑將兩月而未痊仲秋忽遍身發麻合目更甚因不敢合目遂不寐者半月矣諸醫作風痰治療用星夏天麻秦艽病益甚請余求治病人畏怖許以重酬診其脈虛大而濡便血猶未止胃弱不能食面上時有火起此氣隨血下而虛也蓋衛氣行陽則寤行陰則寐臥則衛氣行於陰氣虛行於陰遂不能周於陽故合目則身麻也正合東垣補氣升陽和中湯證即用補中益氣湯加蒼朮黃柏乾薑麥冬芍藥各五分二劑病知四劑病減十劑血止病痊豫再往診病者託故他出以避藥矣夫對證合方其應如響於此可見陳聖年令眷年近三十夏月大勞之後傷風發熱汗出不止初醫作陰寒用參附理中湯汗雖止而增煩熱作渴易醫作傷寒熱病用柴芩白虎不效議投承氣湯下之取決於余診其脈虛大如綿而不數煩躁不得臥者已六日矣視豫曰先生何著紅衣耶望其色面赤如妝舌苔灰黑而滑以脈合證乃虛陽外越也用湯試之喜熱飲飲止一口則非大渴可知蓋此證本於勞倦內傷而兼風暑所以多汗發熱初醫者因汗多誤用薑附以致煩渴繼醫者不辨虛實翻用苦寒虛作實醫逼陽外越儼如熱病正合東垣當歸補血湯證也證似白虎但脈不弦長為異耳誤服白虎必死今誤服不死幸也豈堪復投承氣乎余用黃耆五錢當歸三錢麥冬一錢五味子五分服後得寐片刻再劑熟寐時許醒則熱退面黃脈斂次日往診惟舌黑不改蓋前薑附之餘也用前藥減黃耆一半加人參茯苓甘草二劑舌苔黑退變微黃色遂思飲食如此平補半月而愈程若思守戎令眷年二十外腹痛作瀉已久漸增口舌生瘡因瘡痛不能食熱物益致痛瀉不止前醫謂痛瀉宜溫口瘡宜涼用藥牽制辭不治決之於余診其脈兩關虛大無力食物便嘔嘔止即腹痛痛則下瀉而滿口之瘡白如米粒余曰此脾虛寒也蓋脾土虛則腎水乘之逼心火上逆致口舌生瘡乃上焦假熱實中焦真寒惟治其寒不惑其熱宜用附子理中湯冷飲使暗度上焦之假熱而冷體既消熱性隨發脾土得溫而實則腎水不上乘心心火不逆口瘡不治而自愈此五行相乘之道也遂以附子理中湯加茯苓令其冷飲病人不知有薑附也服四劑口瘡果不痛再求治痛瀉豫曰但藥熱飲則痛瀉自止溫補一月痛瀉方愈後十餘年懷孕病痢亦用桂附乾薑而愈胎竟不墮人之藏府各異不可以一例論也休邑汪介臣流寓瓜鎮孫媳素有腳氣證余不知也産後彌月腳指微痛繼又乳痛前醫者不知用何藥腳乳皆不痛漸次發熱耳聾言語謬妄或歌或笑又一醫作陽明病用大黃下之下後愈甚十日後求治於余兩手脈沉細欲脫耳聾神昏唇焦舌黃身微熱口苦幹嘔身痛僵臥不能轉側夜則呢喃譫語不休至辰刻乃止邪之錯雜不辨何證但足三陽經皆病身痛僵臥太陽也夜譫語陽明也耳聾乾嘔少陽也又非傷寒三陽合病下利之證先以三陽經藥投之觀其應否用紫蘇葛根柴胡為君二陳為使日投四劑通身微汗遂能認人自言腰腿痛甚余方識其為腳氣也蓋前醫初誤致腳氣衝心再誤下致脈細欲絶幸人壯實兩誤而邪尚在三陽未入於陰猶得汗解始能神清即以前藥加蒼朮防己獨活赤芍當歸作腳氣主治痛漸下注於足指半月方愈若入三陰腳氣衝心即喘汗厥逆不可治矣俞子浩兄令眷年近四十艱嗣多郁頸傍結一核數年矣後因喪子其核漸大內逼咽喉妨礙飲食有似外科失榮證瘍科作癭瘤治愈大愈堅漸加發熱咳嗽竟似失榮證矣用逍遙散治之不效又仿外科正宗用益氣養榮湯內有參耆甫二劑便喘不能臥由是醫藥雜投有用葶藶瀉肺者有用蘇子降氣者漸致汗出泄瀉陽氣下脫六七日喘猶不止已備終事復商於余診脈細數余沉思良久其先結核乃肝木部位郁久化火此火結之核尚非失榮誤用黃耆助其肝火火灼肺金因而大喘先無他病雖然喘久斷非氣脫蓋乙癸同源腎肝同治補腎滋肝引氣下歸用六味地黃湯加歸芍麥冬五味子牛膝服四劑喘定二十劑能平臥後用六味地黃丸加沙參元參貝母歸芍丸藥三斤並結核亦全消矣吳侶張僉憲尊閫素有飲證頻發嘔吐醫者用生半夏生附子以生薑汁入藥調服如斯一月有餘計食生薑二十斤意圖除飲之根不無用藥過激遂致耗氣亡陽七日夜不能閣眼而寐招余往診脈浮細如羹上之浮脂指點便散自知周身之氣行於皮內淅淅有聲行至巔頂雙目前如眼鏡兩圓光蕩漾即遍身汗出昏眩不知身在何處余曰此真陽外越不急救之瞬息便脫用仲景之附子湯人參白朮茯苓附子赤芍各二錢服後得合目昏睡片刻醒時兩圓光即收本日又進一劑夜則熟寐達旦如此六七日人事方清爽痰食是其本病嗣後以前藥去芍藥加半夏甘草畏生薑不用醫治兩月方能出戶而立緣生薑辛能散氣多食幾至亡陽此過劑用奇之患也即以前藥為丸十年不發矣李三升文學尊堂年七旬外春末胃中大痛嘔吐紫血碗許而痛吐猶不止脈細數而弦兩脅肋脹痛胃中硬滿因怒未伸而致病經云怒則氣逆血鬱於上此證是也用歸芍鬱金黃連制吳萸丹皮黑山梔以滋抑肝氣之逆少加沉香以為嚮導連服五七日痛雖止而胸阻塞不開易醫謂高年胃冷用辛溫宣氣之品即大便祕結不通食飲難下脈變細澀不堪豫議高年血液枯衰火結於上恐成膈噎辛燥不宜而病人亦惡藥遂以蘆根甘蔗梨藕萊蔔各取汁煎膏用人乳竹瀝調化頻頻咽之半月胸結始開能吞稀粥竟不服藥惟食汁膏尚延數載程錫蕃兄令眷夏月酷暑夜忽畏寒索被即氣塞喉中梗噎無奈坐起大吐紫血條並血水約半盆深夜請附近醫家誤認陰虛用涼血藕節等藥次日往視脈沉而緊手足清冷胸腹脹大此因暑月貪涼食冷本質虛弱氣被暑傷中宮益冷不能健運蓄血暴吐乃經之陽絡結則血上溢之病急宜溫里若作陰虛指日便成蠱證用桂枝赤芍生薑以溫經用蒼朮茯苓炮薑砂仁甘草半夏以溫里如斯八劑身得大汗腹中腸鳴溏瀉數次腫脹方消後以六君子合理中香砂調治而愈蕭我容翁令眷年近四十戊辰夏月胸脅脹滿吐血涎血片兩三日一發飲食衰少而經水時或大行不止有似崩漏初真州時道皆以涼血滋陰為主以致脾胃益虛竟不能食來揚就醫脈之細濡不任尋按有時忽大此思慮傷心脾血不歸經非真陰虛損丹溪云胃虛則血出上竅脾虛不裹血則血下崩此非血熱妄行之證用人參白朮茯苓炮黑薑香附溫補中宮用當歸白芍棗仁丹皮以和營血重用人參服一月吐血先止下血暫少後脾胃得溫而脹減再加黃耆元眼肉合歸脾湯以收功張其相兄未出室令愛首春咳嗽乃恣食生冷肺受寒邪所謂形寒飲冷則傷肺也前醫初作傷風以蘇前解表殊不知邪不在表而直傷肺不知溫肺致寒不解咳甚吐血前醫見血遂改用歸芍丹皮蘇子杏仁貝母以清滋肺熱服二劑遂發寒戰栗手足厥冷身痛腰疼咳吐冷水脈沉細緊表裡皆寒正合小青龍加附子證用麻黃桂枝細辛赤芍乾薑附子半夏茯苓杏仁甘草二劑手足回溫四劑通身冷汗大出咳止大半再去麻黃附子二劑全愈若泥吐血陰虛遲疑其間安得有此速效耶周旦友令眷年近三十兩年前産值隆冬又因氣鬱少腹之旁結有彈大一丸作痛初亦甚微後漸痛甚上衝心脅嘔吐不食必待其痛吐氣衰一二日方止醫治兩年作氣積血積寒氣攻劫皆不效人漸消瘦經水數月不至家居於鄉上城就醫其脈弦而緊詢其病狀答以不發時間或寒熱似瘧脅肋常脹發則少腹之彈丸即長大如王瓜痛衝於心嘔吐不能食衰則仍歸於少腹此産後衝任脈虛寒氣內襲積瘀凝結為婦人之疝瘕此厥陰肝病故自下而厥於上也用肉桂附子當歸赤芍柴胡川楝子烏藥小茴香數十劑發日漸疏而痛亦減輕續以東垣酒煮當歸丸服半年經水始通痛亦不發但少腹之彈丸終不能消而亦不孕數年後變蠱病而殞蓋此證攻劫所傷經水斷絶正氣衰微邪終不散故壽亦不永也吳飲玉兄令眷未出室時左肋下素有氣積時時舉發而痛在家皆用逍遙散治之罔效嫁後懷孕三月此積竟衝心而痛痛甚昏厥手足逆冷口出冷氣脈沉弦而緊此肝經積冷結為沖疝非桂附莫效又屬世醫之女且懷有孕舉世皆禁桂附豫何敢用焉其太翁言修先生曰大人要緊胎且置之遂投以當歸四逆湯桂枝附子當歸芍藥炮薑吳萸甘草茯苓服下即應手取效每食生冷必發發則必須前劑懷孕在腹屢發屢醫而胎竟不傷今所生之郎已十有餘歲矣後以東垣酒煮當歸丸服三年未斷其沖疝不發並形俱消屢屢生育經曰有故無殞先聖之言豈欺人哉徐從甫令愛年近四十暑月病瘧治失其宜瘧雖止而遺病不痊自毗陵來就醫脈細澀無神脾胃敗傷嘔酸腹脹面目浮腫發熱自汗不思飲食形骸骨立經絶不行已半年矣檢毗陵藥方皆乾薑丁沉吳萸半夏陳皮厚朴疏削等藥瘧後氣血交虛何能當此燥劑致增諸證余用人參六君子湯加當歸芍藥砂仁平補以調氣血一月有餘病減半能食熱退而汗全止次年春間值彼誕辰大勞數日前證復作更多咳嗽喉痛口舌生瘡夜出盜汗儼似陰虛勞病擬治後事豫曰脈不細數雖經不至真陰未傷猶可治也不過因勞而復仍屬脾虛中藏經曰脾虛則上下不寧謂咳嗽發熱也此為假火不可以水折反用人參白朮茯苓炮薑麥冬五味甘草合理中生脈湯服二劑口瘡愈再二劑喉痛止去炮薑加歸芍十數劑熱汗咳嗽全退後以白朮煎膏人參湯化下專主補脾百日而康經亦續行教門阮漢章室女年十七歲素脾虛作瀉因喪弟悲慟即經閉半年腹中有形而痛發熱咳嗽腹脹作瀉虛勞證全內經云二陽之病發心脾有不得隱曲女子不月其傳為風消為息奔者死不治此證幸其脈細緩不澀不數真陰未傷尚屬脾虛猶為可治然非百劑斷不能取效市井之醫欲攻積通經豫止之曰血之源本於心脾今心脾俱病血源不生雖通無益徒傷陰也遂用白朮茯苓甘草丹參土炒當歸鱉甲沙參香附陳皮等藥果熱漸退咳瀉皆止但腹脹未減經閉未通腹有結塊此必積瘀用古方萬應丸以生乾漆炒去黃煙為末用地黃牛膝熬膏為丸日服三十丸米湯清晨吞下將一月經水即通下紫黑血塊漸次腹消仍以前藥調治而愈若不先治其本妄行攻堅鮮有不敗者也程其相兄令眷咳嗽二旬先醫作傷風治不效又醫作肺寒以桂枝乾薑細辛治之益甚又一醫作痰火治頗安最後延余診其脈三部皆澀不浮弦非風也不細緊非寒也不滑數非火也每日寒熱汗出鼻有清涕咳嗽不能臥右身不能著席痰涎甚多又非虛損初診未得病情即前醫痰火頗安之藥姑以應之及出門後追思其證應屬肺癰令人取回前藥問所吐痰涎氣味腥甜否彼令侄追至黃師古兄宅中答以腥甜余曰幾誤矣此肺癰將潰也易用苡仁貝母甘桔桑杏麥冬白芨銀花防風服後臭膿大出間吐鮮血脈方現數蓋因前癰未潰肺脹大脈反澀而不出故不數也病人素陰虛臭膿去後便有發熱盜汗等證易用熟地黃山藥茯苓丹皮紫苑兼補腎陰時當酷暑少加人參五味合歡皮以救肺金逮秋氣清涼方獲口完咳止隔年因多食椒薑其癰復潰亦如前法治之而愈式武族侄令眷徐氏年將三十平素嗜煙因內熱復恣食生冷性又畏熱夏初傷風未經發散肺藏寒熱素傷外風未散鬱而為肺癰初不知服何藥癰已成始迎診視則咳喘不能臥寒熱互作項強不能轉側脈浮大而數此肺癰將潰矣告曰肺上生疽彼尚不信用苡仁貝母甘桔葶藶防風桑杏栝蔞等藥服三四日大膿一出皆粉紅淡血及黃色稠膿但腥不臭耳他醫謂非肺癰果癰則隔幔猶臭今不臭非癰也不知此癰因風因冷而傷肺非火熱刑金之證乃肺疽故不臭也醫治十餘日膿盡腫消不甚咳嗽彼以為脫然而愈矣遂畏熱露臥簷階夜受風涼次日大熱大喘猶祕不言至第三日手足抽搐頭痛如破汗出不止周身痛極頸項後仰角弓反張昏厥下利詢之再三始言其故余然後知為破傷風也外患瘡瘍破傷風寒角弓反張尚為不治今內癰傷風則更難治矣已備棺衾求余格外治之遂以桂枝細辛赤芍附子炮薑茯苓甘桔先治風寒仿小青龍治法如此藥不易方服七日身方柔軟汗瀉稍寧略有生機忽又發喘不能平臥腹脹如鼓兩足腫硬又成水蠱此平素飲冷之故遂朝服金匱腎氣湯一劑桂附各一錢以治水午用人參白朮炮薑茯苓苡仁五味子甘桔補中保肺蓋病者中寒麥冬貝母清潤之藥一片不能入劑倘誤用之則瀉不止故也腫消喘定之後腎氣湯易為丸參朮煎藥計服百劑然後癰完咳止嗣後不能斷煙食冷咳腫病每年必發皆以溫肺溫胃而愈此肺癰變證治病必須圓活因病制方不宜固執也真州張右山兄令眷久便血不止以病狀來郡問治於余詢前治法先用歸地涼血不效繼用補中益氣不效又用歸脾湯重用人參亦不效困憊在床求藥治療證經三治法罔效豈非陰結乎經曰陰絡結則血下溢余用桂枝赤芍生薑大棗和營而開絡人參白朮茯苓炮薑甘草補脾以助其健運之常當歸棗仁引血歸肝姑以此試之不意竟屬斯證三次來郡取藥半月而血全止續後咳嗽氣促乘船來郡就診脈細緊兩尺猶甚咳而兼喘頸脈大動豫曰便血既久氣隨血脫肺脾腎三經皆虛將成水腫惟有金匱腎氣湯丸並進加人參於湯藥堅心久服方得取效病者乃同道李仲易兄之姊仲易兄醫理精通不以豫言為謬堅服百劑而愈李懷白兄令眷程休如先生之令愛也懷孕六月而便血者三月矣群醫治不效請余治之診其脈濡溺如綿視其爪甲全無血色兩足虛腫問其食每餐一盂食後即腹痛瀉去方不脹滿問其藥則四物湯加地榆秦艽蒲黃香附陳皮而已余曰脈證如斯脾土大傷不急補脾何以大産用白朮茯苓炮薑砂仁甘草補脾為君桂枝當歸赤芍艾葉溫經為臣薑棗和胃為佐如此四劑三月不止之便血一朝而止矣繼以此藥不加減者兩月至次年大産一男皆吉産後半年又復便血習以為常一月不藥因勞昏僕此乃復病遂臥於床用參數兩服前藥彌月方愈反不似懷孕之時真陰在腹而易效也嗣後遇怒便血常發卞宅內眷屈氏五年前便血因醫過用黃連烏梅苦寒涼藥血去肝虛苦寒傷肝肝主筋遂手足拘攣項背強痛兩脅結塊手不能曲於後足不能履於地坐臥於床者四年飲食衰少形骸骨立幸經水猶通天真未絶耳因往屈宅便令診之脈弦細緊答以肝經虛冷須服溫經熱藥用桂枝細辛當歸赤芍半夏茯苓附子吳萸甘草立方令其自制藥服彼畏藥辛熱反多謗議棄置不用一年後又往屈宅別診他病再請診之病益甚豫曰仍是前方如放心百劑或效然不可必也因諸醫遍治不效不得已以余方自制姑試服之十數劑頗安兩手和柔來又求診更加乾薑往診十餘次皆前藥加減或官桂或桂校附子每劑錢半薑亦如之惟立藥方彼自制藥堅服半年手即能舉足亦可步脅塊皆消周身筋舒竟為全人屈宅本籍關東崇敬時道因不相信故不用藥惟立方也李子立兄令眷年三十外頻次半産産後未及滿月便乘涼食瓜果中秋夜乘涼外感風寒即咳嗽惡寒嘔吐痰水又當經水大行之後前醫不辨外感風寒猶用調經養血補劑見咳嗽益甚又疑去血過多陰虛咳嗽再用麥冬貝母以致表邪不解里冷益深惡寒發熱汗出咳喘坐不能臥吐不能食腹脹作瀉遍身麻木筋骨冷疼自疑必死促備終事急迎救療脈浮細而緊余曰風寒積冷表裡皆邪須重劑方解無足慮也以小青龍湯加減用桂枝細辛防風赤芍附子乾薑半夏茯苓杏仁厚朴二劑得冷汗一身遂喘定得平臥如斯八劑表邪解後咳喘身痛甫退旋即里冷發作腹痛下痢白膿轉用附子乾薑肉桂合胃苓湯八劑冷積消胃氣本厚故易效也邵子易兄令眷年四十外形盛多痰素有頭風嘔吐之病每發一二日即愈畏藥不醫習以為常二月間感寒頭痛嘔吐視為舊疾因循一月並不服藥漸致周身浮腫咳喘不能臥嘔吐不能食已五日矣方請醫治切脈至骨微細如絲似有如無外證則頭疼身痛項強膚腫足冷過膝咳喘不能臥滴水不能下咽沉寒痼冷證皆危篤必須小青龍湯方能解表裡之寒水但苦藥不能下咽先以半硫丸一錢通其膈上之寒痰繼以麻黃桂枝細辛附子乾薑半夏茯苓吳萸煎劑與服初劑尚吐出不存又進半硫丸一錢次劑方納如斯三日雖小有汗足微溫而脈不起全不能臥寒水之勢不退余辭之令其另請高明有一浙醫視為濕熱用木通燈草腹皮為君幸病家粗知藥性不令與嘗專任於余改用生附子十劑至四五日通身得汗喘咳始寧方得平臥頻頻小便而下體水清非此大劑何能化此堅冰後用理中桂苓加人參匝月方健詢彼家僕人乃平素貪涼冷所致若此證屬脾腎虛寒則不可治矣洪育滄兄令眷于歸未久正月上旬胃中大痛前醫用蒼朴炮薑香附不效至夜痛厥次日迎診六脈沉緊而滑昏臥於床不知人事手足微溫身體軟重告曰寒痰滿中非辛熱不醒時孫醫先用附子不敢服余用附子乾薑半夏茯苓白蔻陳皮一劑服後半夜方醒自言為人釋放回也次日再診諄言人雖醒而脈未回寒邪猶在仍須前藥勿巧虧一簣也而洪宅素畏熱藥棄置不用以他醫參朮炮薑半夏平和之藥為穩妥殊不知邪未退而溫補反致助邪醫將一月終日嘔噦不息飲食不餐至二月初三噦變為厄其音似吠越鄰出戶連聲不息口張不能合四肢厥冷揚手擲足欲裂衣袂目珠上視其勢危篤從未經見者也京口名家見病愈重而藥愈平但用丁沉柿蒂烏藥橘紅半夏應世之藥而已急復求治余曰脈細疾無倫幾於不見若不以大溫之藥疾驅其寒亥子之交必致陽脫遂用生附子生乾薑半夏各三錢吳茱萸一錢一劑氣平二劑手足回溫其夜計服四劑吠聲方止仍如前厄次日仍用前方但換熟附子加茯苓橘紅每日仍服半硫丸三十顆一月後加白朮合理中六君共計服藥百劑方能食飯不厄經水始通漸次調治而愈此證可為病家醫家惟求平妥釀病不醫之鑑蕭俎玉兄令眷年近三十病頭眩嘔吐飲食減少經水不調積年已久因其大便祕結真州時道皆作血虛肝火而以歸芍丹皮生地黃麥冬貝母治之病益甚甲申冬自海陵回真州舟中招診脈細緊而滑畏寒抱火手足麻木十數日一發飲食不餐胸口一脹即頭眩嘔吐吐去痰水稍愈隔十數日又發遇行經而血甚少亦不如期以脈證相參此氣病非血病乃脾胃虛寒痰飲證也所以脈緊而滑若血病則澀矣滋陰養血適足益病夫大便祕結者津液上吐無以潤腸乃冷祕虛祕非燥祕也遂用人參白朮茯苓半夏炮薑天麻香附生薑以東垣白朮半夏天麻湯為主專用氣藥以溫胃陽全不雜一味血藥恐助陰也立方回真州令其常服兩月後蕭兄持煎藥方來求立丸方謂藥已中病病愈大半今大便反溏非若從前之祕結觀此則非血虛燥結明矣凡人稟氣血之軀患病不偏於氣即偏於血不辨氣血之偏何能求效耶曹啓心兄如君生育多胎體質虛弱有腦寒鼻塞流涕之證懷孕七月先咳嗽前醫不諳以流涕為傷風誤用發散因虛愈咳咳甚則吐食又以為胃寒用六君子湯加炮薑服之愈甚繼招余治脈弦數六至胎脈固當數然不滑數而弦數此必陰血大虧也啓兄云平素胃寒麥冬貝母入口便吐瀉奈何豫曰治病必以脈為準今脈弦數定屬陰虛滋陰不可補陰獨不可乎此因咳而吐非不咳而吐也但治其咳自不吐矣脈經曰陰虛陽無所依令人多嘔者此也豈陰虛獨無嘔病乎定以熟地黃為君山萸茯苓山藥石斛苡仁沙參為臣枇杷葉為佐四劑知十劑咳嗽全止而産一男産後再以當歸川芎桂枝辛夷炮薑黃耆溫補之劑以醫鼻矣瓜鎮胡宅之內眷隔幕診脈兩尺弦數左關單絃獨異他部默不言病似欲考醫者余因脈言病謂兩尺弦數定為下部之痛數則為熱必有血證但不知為何病彼家然後直告謂一月前小便淋祕而痛因其夫常宿青樓疑為梅毒瘍醫以斑蟊毒劑下之致血大下而痛愈甚經數醫雜治而病不減非敢試醫因褻病不能直陳耳余遂以脈辨證弦者肝病數者火證少腹乃肝部婦人肝經內絡廷孔廷孔者溺孔之端也鬱怒生肝火火循經而結於廷孔所以初病小便淋祕而痛誤行攻劫以致益甚因屬隱疾不便明言以逍遙散去白朮加生地黃炒山梔龍膽草木通連進二劑次日痛減因復再招遂以陰瘡證書封問其夫合病則治否則當別延醫也其夫云的是此病即以前方服十餘劑痛止減去膽草木通加丹皮白朮香附十數劑而愈又一婦人中年心事鬱怒血崩已久因血虛而肝火益甚流於下焦內結陰瘡少腹有塊按之則痛大小二便常時下迫痛甚下膿血如帶則痛稍減隔十日半月又痛又下此屬虛邪雖用滋肝涼血之藥治之不效血液日耗漸變虛勞寒熱咳嗽痛楚而殞程育松兄令眷年近三十素貪涼食冷寒注下部致成寒濕腳氣夏觸風涼其疾即發腳氣之惡從未經見往歲輕舉他醫所治壬午年夏月腳氣上衝頭疼身痛嘔吐不納藥陰躁不能臥令人扶挽而走徹夜達旦如犯之狀脈細疾而硬煎劑不能咽此陰甚格陽格拒不入作伏暑夾陰治法先以來復丹碾碎湯調服下以通其格拒服後方能納藥再用六物附子湯以治陰寒腳氣附子乾薑肉桂防己蒼朮茯苓半夏驅逐逆上之陰寒四五劑後腳氣方下歸於兩足而煩躁嘔逆漸除能進米飲七八日足始熱而痛愈同道周兄令媳值阿翁作古之後懷孕三月患腳氣兩足腫痛用藥敷之已不合治法母家見痛甚又用炒熱麥麩頻尉不息腳果不痛而申酉時即跳躍如狂譫言亂走天明至日中皆安如是三日不識何病因以相招脈弦長而數余告曰此腳氣衝心故語言謬妄幸兩寸脈未變脈長而數尚在陽明此因火迫上逆須用肉桂引其下行使腳仍痛方妙彼因有孕不肯用桂余諭之曰狂跳不息胎亦不安去病即所以安胎經曰有故無殞用桂無害也竟用肉桂五分余皆三陽經治腳氣藥二劑即兩足復痛人事清楚不狂妄矣後彼家自治而愈吳中璧兄令愛年將及笄出痧後半月惟口甜喜唾不思飲食胃中隱隱微痛脈虛軟而遲幼科以口甜為胃火作餘熱治之此常理也但脈不長不數口不渴而反喜唾必以前過用膏芩熱雖解而中寒生致有此證且口甜者脾虛之真味也胃陽發露無實熱脈證反屬虛寒當變法治之用六君子湯加炮薑益智仁二劑知四劑即口不甜而能食大凡痧痘真陽未破之童身苦寒可以恣用出幼男子經通女子及已婚娶破陽痧痘當用膏連十分者寧用七分以防中寒曾治一婦人産後未滿月出痧幼科尚未用涼藥痧回七八日卒然腹痛厥逆嘔吐六脈全無竟用四逆湯加人參肉桂數劑方痛止脈出又見一幼男子出痘後未得溫補卒然腹痛厥冷汗出未終日而殞汪彥玉兄令侄女年十三歲夏月喜食瓜果仲秋患心內怔忡作嘔幼科作氣虛治用參朮不效又易醫誤認為大虛用歸脾湯本家恐其過補未服至夜嘔吐即昏厥手足逆冷不知人事用生薑湯灌下數刻方蘇次日迎診六脈沉弦而緊身疼頭眩手足冷麻胸前嘈雜余曰沉弦主飲緊則為寒此外感風寒內停冷飲表裡寒邪未解脈沉怔忡皆痰飲證非虛也用桂枝蒼朮半夏茯苓炮薑白蔻陳皮數劑嘔止轉發厄更加附子則每日吐冷痰水碗許厄乃止怔忡亦愈仍用前劑則夜夜微汗身發癮疹作癢身痛方除此風邪化熱而外解也繼用理中桂枝二陳醫治月餘裡寒退盡能食不嘔而痊喬俊升光祿令愛年七歲二月苦冷右脅忽大痛呻吟不絶手不可近脈沉弦而緊手足厥冷幼科不知何病囑余治之豫曰半月前曾嘔吐長蟲不能飲食用烏梅丸吐止今又脅痛合而論之厥陽寒證也當溫里為急用桂枝赤芍細辛乾薑半夏吳茱萸茯苓日進二劑右痛移於左而下連於肋此少陰部位也遂加附子又二劑則夜發熱咳嗽喘促鼻煽下利黃水余沉思良久其吐蟲時便爾受寒未經解表今見諸病皆屬小青龍湯證乃寒水沖逆於上下當以汗解但病因循日久必兼溫里用桂枝細辛麻黃赤苓半夏附子乾薑五味子甘草生薑日服二劑得汗而熱退喘定再二劑又汗而瀉止脅肋之痛移於少腹始去麻黃細辛桂枝換肉桂以溫里其痛方除每日微汗八日後咳嗽始寧十日後以理中湯合桂枝湯溫經調治而愈觀此足徵幼兒傷寒當與大人同治世俗皆謂小兒純陽不宜溫熱豈小兒竟無三陰病耶丙戌續案吳楚佩國學令政年五十八歲十數年前病寒誤用涼藥幾至危殆得團弘春溫劑而愈致遺中寒痰飲咳喘脹滿不能臥之證數年一發例用溫肺湯加附子而平己酉仲秋不由外感而咳嗽因素有痔血之病乃追怨弘春之熱藥惡薑附如仇延至初冬則虛寒畢露右尺脈全無反真陽外越兩足發熱夜置被外面赤咳喘右肋氣衝不能著枕而臥乃寒水上逆水蠱之機暗加附子以茯苓為君附子炮薑半夏為臣芍藥為佐用真武湯之意日投二劑將一月咳止脹消反惡寒足冷彼方知本體虛寒遂加人參白朮冬至後陽回足溫藥不易方至立春尺脈略出半部春分後始得滿部而痔血亦愈芍藥加多必致溏瀉病時傍議洶洶惟病人不為所惑必不易醫右尺半年無脈薑附藥二百餘劑方起於床可謂沉寒痼冷矣胎産治效王蔚園兄令眷山右先生六媳也懷孕八月忽下血不止其胎欲墮又值秋暑嘔吐非常醫士沈目南與余同道主以固氣防脫用大劑參附湯頻灌一夜服參三兩熟附兩許天明胎墮而産母幸全惟虛憊之極脈微似脫飲食就枕匙進揚俗産後例不用參次日不免大減至第三日忽然床上跳下滿房亂走或笑或哭竟似顛狂而沈醫先生認為瘀血發狂用芎歸湯加童便煎成將服矣余適至急止之診其脈散大無倫面赤氣促不避親疏豫曰前夜血脫於下今復陽亡於上不急救瞬息脫矣此亡陽證也仍用前法以人參五錢附子二錢急煎與服隨又一劑方定令人抬上床閉目一刻及醒前事皆忘仍復臥床頭不能舉繼用參耆歸朮炮薑等藥醫治七日忽腹大痛先瀉後痢紅白頻下二便不禁勢更危篤因詢夏月食瓜果否若曾恣食瓜果尚為寒痢不然此即五藏之氣絶於內為下脫證萬無生理矣家人答以日食西瓜於是告以必須薑附王兄首允即用附子理中湯加肉桂赤芍茯苓砂仁七日痢止轉變嘔厄吐痰眩暈大便頻而溏大能登桶全不欲食蓋平素胃冷多痰元氣稍振本病復萌其嘔厄眩暈皆痰飲也屏去血藥專用附子理中湯加茯苓半夏天麻白豆蔻每劑人參三錢醫治百日計服人參數斤床上方能坐若其狂跳時倘無灼見則差之毫釐便失千里矣瓜鎮吳象衡兄令眷懷孕臨盆喪子悲慟不數日生産一女悲怒交加産後即胸脹寒熱煩躁歷醫三四位皆主疏氣消瘀至七日不效始迎余治脈虛大無倫煩躁作渴輾轉於床時值秋暑目中流火視物皆赤豫曰此産後虛煩真陽外越若不溫補必致危殆象衡素自用答曰胸脹如此豈勝補藥耶煩熱如此豈勝溫劑耶余言之極力其嶽家亦以前用消克其病愈甚為辭象衡為理屈不得已聽余用藥余勉以歸脾湯加炮薑用人參一錢服一劑頗安再劑則熱止得臥如此三日諸證皆回但脹滿未解耳彼懷疑誤補又惑前醫之言以前胡厚朴陳皮半夏知母丹皮清熱寬中五六日脹滿未除更增腹痛瀉利汗多不食嘔噦似厄矣病益加重前醫束手無策又復求治余曰病危矣前藥亦不應須用附子乾薑挽回於萬一言明不效勿怨遂用人參五錢附子白朮乾薑肉桂茯苓各錢半大溫大補始克有濟下咽一刻即汗斂嘔止如此大劑十日瀉止能食一月方減藥而病亦漸愈若其復請時以前醫翻案置懷不一援救豈不坐視其斃乎喬世臣大行令政年近三十本體氣虛中寒痰飲頻年半産因此更虛酷暑小産嘔吐不納藥食者數日矣即參附湯亦難下咽汗出如水證皆氣虛因思盛暑傷氣中宮愈冷暑挾痰飲上逆而吐略去産後作中暑嘔吐擬用半硫丸而沈目南同道亦以為然遂進二十丸不吐又進二十丸亦不吐再進二十丸全不嘔矣繼以人參五錢半夏茯苓附子各二錢日進三劑專作暑醫三日後加白朮炮薑減附子溫中補氣飲食始進七日後減參二錢調補匝月方能坐於床始終皆用氣藥若泥産後芎歸去道遠矣程元美兄令眷年近三十産後未滿月得發熱咳嗽吐血盜汗等證産前並無此夙疾合當溫補而前醫竟作陰虛主治投以四物湯知柏花粉黃芩病愈篤矣豫往視之脈浮大而數按之中空壯熱喉痛咳吐血涎腹脹作瀉此産後誤用苦寒中宮虛冷逼陽於外也用理中湯加麥冬五味子黃耆服後陽氣內歸則脈細如絲矣其初吐之血淡紅血涎乃脾虛不裹血非陰虛火逆衝出之血也煎藥仍主前方更加八味丸兼補腎水所謂土旺自生金毋拘拘於保肺水壯自火息毋汲汲於滋陰是也調治半年經水方通一次旋即不通咳嗽未全止脈澀不滑臍下結塊其時喜尊素先生診脈亦云非胎定為血假以八味地黃丸加倍桂附添入降香節牛膝以通經日服不輟忽腹大痛意其經通不意竟大産而生一男夫病中及質弱者胎脈臨産尚且不形於診則脈不足憑矣醫道誠難言哉馬彬五別駕未出仕之十年前尊閫大産去血過多昏暈大虛前醫重用人參耆朮已虛回血止飲食如常惟晝夜臥於床不能坐起坐則頭眩耳鳴必睡下乃可如此已七十日日服人參四五錢不效招豫治之診脈惟細遲無力而飲食不減平時肌膚聲音似無病者此産後不慎起居肝腎氣虛肝虛不攝氣故眩暈也仲景謂之褥勞久則成痿用仲景之羊肉湯治之用精羊肉二兩煮熟去肉再以黃耆五錢當歸五錢人參一錢入湯煎熟日服二劑十日後即能起坐二十日即可步履回季宅母家調治而痊瓜鎮曹實甫令眷年將三十産後二日忽惡寒發熱頭痛身疼醫認作傷寒斷食三日汗大出而熱不退更增煩躁實甫具病狀問治於鎮江何似充先生何答云産後以大補氣血為主雖有他疾以末治之藥用參耆歸朮茯苓炮薑麥冬五味甘草實甫覆呈方於前治之醫斥之曰老朽已聾瞽失時此等傷寒熱證豈堪補耶又任其專治七日則愈熱愈躁而脈愈大暮夜相招脈散大呻吟狂躁熱渴揚手擲足幾不欲生豫曰産後虛煩急須溫補發藥加參實甫以何藥見示藥竟相同遂放心與服服畢即安臥次日脈斂熱退囑其仍要加參實甫惜費不用逾一日夜復熱躁欲脫通夜服人參七錢始安如前參耆歸術調補匝月而起瓜鎮王篤之兄適嚴宅之女懷孕九月冬月苦寒患病據嚴宅云初病是傷寒已經半月發表攻裡俱已備嘗因腹中大痛恐是臨盆穩婆已伺候矣迎余決之診其脈沉細而緊畏寒之極坐臥火箱中猶抱火烘面其痛在臍上左右衝擊而動不在少腹而脈又沉非欲産之候此誤用攻導涼藥致中焦寒極非溫不可而前醫猶要用行藥謂通則不痛也豫議用薑桂病家畏桂墮胎豫諭之曰將産之胎非若一兩月血胞畏桂行血且中宮冷極桂至中宮尚不能敵其寒何能下達而傷胎乎失之不溫産婦且危去病即所以安胎也遂用人參炮薑肉桂當歸砂仁陳皮甘草一劑痛減溫補半月方産産時幾至虛脫得補而回蕭朋玉兄令眷自真州來郡就醫因小産後發熱吐血真州時道認為陰虛竟以生地黃白芍丹皮麥冬貝母治之殊不知此乃小産後瘀血未盡因而發熱血不下行而逆於上也將兩月漸致腹脹而痛嘔吐不食面黃浮腫少腹結塊發熱惡寒脈沉細緊按之堅硬而長血為涼藥所凝病成血蠱必須溫暖其瘀方化用附子肉桂炮薑當歸赤芍五靈脂香附延胡等藥四十劑遂大下黑血如泥者數碗由大便而出腫脹痛一夕皆消而人虛困殆甚繼用溫經和血健脾之藥半載新血漸生而經再至方健黃美倩翁令媳汪氏産後腹痛四閲月真州來郡借居吳天其翁宅就醫診脈細數而澀臍下作痛午後發熱惡寒咳嗽盜汗儼然虛損矣而經水或紅或淡猶未止詢真州時道治法或用大黃紅花桃仁或用肉桂炮薑附子遍治不效漸增發熱咳嗽脈證皆屬陰虛但敗濁屢月不止則非積瘀又腹痛有形脈不緊且已用薑桂附子而痛不減則非寒余擬其為腸癰未遽用藥令其看腹皮粗糙否臍中有臭水否腹內可有水聲大小二便可墜脹所下敗濁似膿血否病人答云件件皆有余曰此腸癰誤治無疑矣今已潰未收口須兩月方愈不能急效病人唯唯遂以六味地黃湯去澤瀉加人參苡仁當歸赤芍桃仁肉桂為煎劑外用六味地黃丸去澤瀉加人參黃耆此外科治腸癰之七賢散也用蜜為丸如此煎丸並服一月咳嗽發熱先退又半月膿血方淨而痛亦止完口之後回真州孫飛聞二尹令弟婦蔣氏産後瘀血未盡滿月後腹漸大痛臍下有塊大小二便裡急後重大便難出小便如淋亦難出前醫已用芎歸薑桂溫之不效及余往診床上不能坐下迫痛甚兩尺脈獨數腸中水響而又不瀉兩腿並腹牽引而痛豫曰此積瘀為患尺脈己數乃血積於腸回環處寒化為熱將成腸癰不急通之成膿難治先用當歸赤芍苡仁丹皮栝蔞桃仁痛雖略止而大便不通不得不用大黃以宣導矣遂用舊方烏金丹乃大黃膏蘇木膏合群血藥為丸者早晚各服一丸大便次日雖通仍無瘀血痛不止又一日進三丸紫血方下次日痛減仍用前苡仁煎劑以逐其餘至下月經水大通而痛始全去方漢辰兄令眷右周族叔之女也大産死胎穩婆手重致傷子腸七日後招治大小兩便不通已四日矣少腹腫痛如墳仰臥於床不能轉側他醫作腸癰治用菜瓜子為君食之不效又醫作瘀血治亦不效診其脈澀而數因小便脹痛遂不食虛憊不堪余深思良久腸癰乃瘀血積腸中久而始化膿作痛今産後方三日而即腫痛斷非腸癰若瘀血作痛血病不祕小便若寒痛少腹不當高腫如墳且脈不緊而反數以藏府內景圖為證婦人胞門子戶居中膀胱在前直腸在後以理揆之産時手取死胎傷而不覺後三日腫大前逼膀胱後逼直腸故大小便皆不通其少腹腫高如墳者乃膀胱中小便也令老成婦人以熱湯漬布揉按腫處問痛在前按處否病人答以腫處不痛其痛在裡豫曰是矣令漬布者以手重按腫處則尿如湧泉瞬刻腫消續有敗膿瘀血源源而下急令煎大劑參耆歸芍肉桂附子炮薑等藥促令煎熟頻頻灌下又令再煎二劑恐大便隨下以防氣脫後片刻大便果下幾乎暈脫然卒無害者幸服藥在前也後用內癰瘍科治法皆用參耆歸芍桂附炮薑苡仁收功獨不用白朮者恐助膿也醫治百日方能起床嗣後仍復生産汪公肅兄令眷夏初大産天氣猶寒生時亦快而不解事之穩婆巳至不令上床令其久坐穢桶以俟下血次日即腹痛大小便皆不通玉門腫閉小便反自大腸滲出第五日請救脈沉緊先醫用芎歸消瘀不效又用理中補中亦不效痛脹益甚細詢病狀蓋由産後玉門未斂久坐穢桶寒氣襲入下焦陽氣不通前陰腫閉陰陽乖錯小便反從後陰滲出此非交腸之病乃屬厥陰中寒明矣所幸者尚未厥逆於上耳但乙癸同源腎肝同治且腎主二便開竅於二陰又屬厥陰純寒只得借用少陰治法以四逆湯主之附子三錢乾薑二錢甘草一錢肉桂當歸各錢半日進三劑小便微通腫處微消如此藥三日九劑小便通而瘀血甚少五日大便通半月臀上生癰蓋因瘀血未淨寒因熱化而作膿潰也病者幸因前藥見效不致怨熱藥貽患許蓼齋太守令眷中寒痰飲薑附時服平素皆然産後十年不孕甲申秋自稱懷孕下血胎脈不現用補氣安胎藥三四劑隨止隔一月又下血又如前藥又隨止隔一月又大便下血甚多以平常時有之證不服藥而飲燈心湯又服涼藥不但血不止更增腹脹不食頭眩身麻冷痰上壅大便下迫不能坐立診脈弦細而緊胎脈不見余遵內經陰絡結則血下溢治法用人參白朮桂枝當歸赤芍炮薑甘草少加附子四劑血隨止即現中寒夙疾胸腹脹大嘔吐痰涎喘促不能臥脈更沉小此證必須薑附然恐傷胎而令尊汪間先翁主持謂大人要緊遑顧其胎且懷胎四月三見血下脈不又旺薑附素常服慣竟用無妨遂用薑附茯苓半夏吳萸橘紅日服三劑頗安而脹嘔不減換生附子連服七劑始得不脹不喘不嘔方改用熟附炮薑加參術脹滿然後全消未幾又氣虛似脫心內怔忡令人抱按方能臥又非痰證怔忡余暫用人參三錢歸脾湯三五日正氣虛回痰飲又發仍用前劑但以乾薑配熟附兼用參術而對夏苓將一月年終病退即不藥矣乙酉之春因痰咳嗽相招胎脈始現腹大有形至六月大産男胎産後本日血不下小便一日夜不通脈兩尺沉遲無力此産後下焦虛冷不能小便而病人自云舊年病急多服薑附致內熱小便不通余亦不與辨至更余則腹脹如鼓直坐於床不能轉動腹中冷氣上衝彼方知尚屬虛冷向余云內熱之説誤言耳惟求急救若遲則痛脹死矣其時亦汪間先翁主持用附子一兩肉桂乾薑當歸茯苓各三錢大銚急煎頓服少刻腹內腸鳴尿血大下至五更方得平臥後用溫補而愈懷孕服薑桂附子藥百劑而不傷胎産後一夜服附子一兩亦不覺熱此證世不多見經云有故無殞其斯之謂歟孫以𬆭兄令眷豫族侄女也懷孕值暑月以西瓜浸井日食為常至産後氣血交虛積寒在腹三日後胸腹脹滿而堅猶如未産乾嘔不能食咳喘不能臥足冷過膝脈沉細而硬其母謂三朝食麵著氣停食再三囑用消導之藥余曰形寒飲冷則傷肺所以喘咳積冷於中先有胎元真陽在腹可以勝其冷物今胎已産氣血兩虛其沉寒痼冷蟠結於上中下三焦否塞不通惟宜助陽消陰若克伐傷氣則陽益消矣此證非大溫熱宣補兼施不能望其效也以𬆭唯唯遂以生附子生乾薑半夏吳萸以溫里桂枝細辛生薑以溫經助以人參茯苓赤芍以培氣血以𬆭日藏人參於懷暗投藥中以免其嶽母之惡補也服至半月上身微汗而咳喘寧再服一旬胸結略下而能納穀冷祕二十餘日日服半硫丸二錢大便方通其矢碧緑彈丸續續而下計兩月腹中上下方通沉寒痼冷未有如斯之甚者若順人情而妄用消導不知作何結局矣張渭光兄令眷年逾二十懷孕三月時值仲秋胎動見紫血水前醫猶用生地黃黃芩保胎一二日紫血下不止腹脹痛甚延豫托診脈沉緊堅而搏手此下焦冷極胎已無氣所以血紫也再用涼血是益其冷矣用芎歸炮薑砂仁溫中活血之藥腐胎始下痛止而脹不消腹堅如石脅肋脹滿上衝於心滴水難下噦厄煩躁坐不能臥臥則氣喘兩尺脈皆伏他部弦細而緊不任尋按據證脈竟是肝藏中寒須作厥陰傷寒治法其産後芎歸套劑一片不能入口矣此暑月貪涼食冷不慎起居積冷下焦之病一醫猶用參朮補中病家因脹甚不與病狀危篤力辭不治堅托無奈用半硫丸一錢以開隔上之寒痰方能納藥繼用生附子生乾薑肉桂赤芍吳萸半夏茯苓每日三劑兼服半硫丸三十粒如此三日方就枕不喘能下谷湯而脹厄猶然不退肋下有形而痛前藥換熟附子又服六七日胸口稍軟噦厄始減而少腹猶堅再加當歸以和厥陰之血腹內凝冰幸而不利服半硫丸半月大便通色皆青緑終無一點血下而腹亦消揚俗滿月洗浴以致受寒病復前證皆集但不喘能臥耳仍用前藥治半月方回胎前積冷産後中寒竟與前孫案相同但此證不大虛惟不用人參差異也懷孕內眷當以此示警程農長兄令媳吳宅之女也二月大産天氣尚寒未滿月便開窗梳洗方滿月便爾洗浴因受風寒次日頭痛身疼遍身筋惕汗多而熱不退脈不浮而單絃初診便告病家此産後中風大病不可輕視用當歸四逆湯當歸赤芍桂枝細辛茯苓炮薑甘草薑棗為引醫治三日因本氣大虛風邪不解更頭疼如破筋惕肉瞤汗出如浴手足抽搐時時昏厥病甚危篤余曰此産後氣血大虛風邪直入肝經已現亡陽脫證須急用人參固里附子溫經使裡氣壯逼邪外解否則風邪入藏必昏厥不語手足逆冷嘔噦不食不可治矣未幾果噦病家遂信豫言重用參附加於當歸四逆湯中更加吳萸以治噦間加天麻半夏兼治虛風如斯大劑日服人參兩許附子六七錢半月後方漸次而回再去細辛吳萸增耆朮四十日方能起床此證幸病家不吝人參而任醫得專故獲收功也吳紹先兄令眷年三十餘歲平素脾虛中冷而夾痰飲生産多胎氣虛時暈癸未春間懷孕一二月便下血服藥而止隔一月又下血藥亦不止聽其淋滴不斷者半月欲其墮而不墮反自止本性畏熱喜風兼嗜瓜果六月夜分霍亂大吐吐後汗多厥冷遂昏沉不語手足抽搐目珠上竄次日往看脈弦細而緊軟臥於床手足微溫手筋惕動而手即攣灌以藥能咽嘔則欲吐幸小便未遺欲小便則有起床之狀人扶起能自立而便但目不瞪口不能語耳此因大吐中虛寒痰上湧須用類中風治法揚醫衆議不一適金壇周醫駐揚議論相合於是定方六君子湯用人參一錢白朮茯苓半夏曲桂枝吳茱萸薑汁天麻橘紅灌服二劑至夜半回蘇計昏厥一晝夜次日能言謂周身皆痛氣塞喉中胸中脹悶腹痛作瀉外則筋惕而手拘攣嘔厄不能食又迎鮑醫亦主溫補議用肉桂豫因頻次下血恐桂破血易用桂枝合真武湯換炮薑救其亡陽虛脫議用人參一錢白朮茯苓炮薑附子芍藥桂枝甘草薑棗為引如此溫補之劑服一月方能坐床進食後漸次去附子調理而愈至冬杪生産一男母子平安若病時執懷孕不用附子半夏之説病必不除則産母不保母不保又安有子乎程案産後中風則氣血交虛故施重劑此胎前中風因未産不甚虛故劑輕也張其相兄令眷年望四旬隆冬大産後六日家務煩勞遂惡寒發熱身痛嘔吐不知何脈前醫認傷寒用桂枝細辛乾薑吳萸赤芍半夏等藥二劑遂大汗不止血下如注暈脫者二次本家先以人參數錢灌回豫踵至汗猶未斂脈細如絲血尚未止雖有聲音而不能言豫曰血脫益氣此定論也用人參五錢附子二錢炮薑二錢連進二劑方汗斂血止而能言語次日即改用歸脾湯加黑薑官桂溫補滿月而起程載錫兄如君艱産産後即暈厥醒後喉啞全無聲音而人事清楚脈細如絲手足厥冷蓋艱産玉門久開寒氣襲入經云寒中少陰令人卒然而啞且脈細厥冷可徵也用四逆湯疾驅其寒以防變證用附子三錢乾薑三錢甘草一錢當歸三錢連進三劑次日音出瘀血方下蓋少陰經絡盡於喉寒極於下腎氣不能時上致卒然失音若非重劑入里之寒何能驟解數日後因難産內傷腫痛去附子加肉桂赤芍桃仁腫消痛止半月方愈英德縣令王公僕婦年三十外本出西人夏月恣食瓜果八月初旬産後積冷在腹五日後腹痛先瀉後痢兩關緊滑用薑桂香砂胃苓湯四劑而愈兩三日後因前寒未解喉痛又開窗取涼復受寒邪以致頭疼發熱身痛脈浮緊用芎蘇飲微汗而表解熱尚未除繼用桂枝葛根湯二劑熱即退忽變為神昏不語掐指剔牙腸鳴下利問病若聾診脈弦細無力産後尚未滿月知屬裡虛證類中風用桂枝湯加白朮半夏天麻炮薑附子二劑五更後即能言至未申即不語坐臥如凝能言時謂身痛腹疼其渴飲茶湯日夜兩大壺隨即洞瀉八九次腸鳴水食脈弦細緊此為風邪直入肝經乃厥陰之病蓋厥陰病本消渴風邪不解內搏為瀉身痛多汗脈不浮斷非表證乃骨寒而痛也且午後不語定屬陰邪準作厥陰治法不治洞瀉用當歸四逆湯桂枝當歸赤芍細辛附子炮薑人參白朮茯苓甘草薑棗為引服六劑渴全止夜得微汗腹痛身疼即解瀉止能言自立方付彼令其照方撮藥服十餘劑即全愈若用育神止瀉不察病名豈不大誤乎余每見産後不語不治者多矣此北人胃氣本厚故合證之藥易於取效也前程案乃寒中少陰寒水之藏故終日不語陰也此證乃風中厥陰風木之藏木中有火午後方不語非純陰也所以藥亦陰陽對待不似程案用純陽藥矣適朱宅三小女體素虛寒懷孕將産先胃寒嘔吐服理中湯而止續即兩足少腫未旬日上腫至腿漸上至少腹內懷雙胎其腹脹大欲裂氣喘不能行立脈細如絲兩足冰冷小便點滴不通水已上溢不急治水胎必浸傷而孕婦更不能保矣諒桂附尚不能敵水何暇傷胎且胎已足月桂附不能犯遂用附子乾薑桂枝人參白朮茯苓澤瀉大劑與服日投二劑四劑後足微溫小便略有服至十劑上腹略軟水盡下注於兩足惟臥床不能坐矣又十餘劑水從大小二便齊出消大半而雙生兩男産後因胎前藥力三朝尚全無病遂經理家事忽然腹大痛大吐大瀉困憊於床脈細緊無倫惟恐痛脫仍用前人參附子乾薑肉桂茯苓甘草因腹痛故去朮也日服人參六錢藥三劑六日痛止加白朮溫補四十日始康其産後惟兩血餅所下皆水此陽氣虛血反化水若執懷孕桂附傷胎而水不下必致子母兩殞經云有故無殞良不誣也其所生之子出痘甚輕則桂附不貽害於兒亦可知矣出痘之兒因痘甚輕未滿月便出戶見風至滿月後作瀉十數日忽患驚風幼科皆稱慢驚不治已擲於地惟候死耳豫視之忽啼號數聲即手足抽搐眼珠上視頭向後仰身體僵直夫慢驚抽搐不先啼叫且頭不後仰身不僵直今有此數證則非慢驚蓋天釣風也其先啼者腹中痛謂之內釣內釣後即外釣抽搐此因痘後失調又經久瀉而兼風邪故有是證必須溫經補中余遂用桂枝赤芍鉤藤人參白朮炮薑附子半夏甘草灌下二劑即回蘇但不能吮乳日進米粥然一日必啼號十數次抽搐十數次而參附藥不輟幼科畏熱暫止數日即瀉不止瀉甚則內釣外釣亦甚不得已堅用之抽搐止即右手足痿軟半身不遂如此大劑一歲之兒服至百劑瀉方止足可站立但右手尚不能持物笑則口歪若非參朮桂附乾薑何能有生有斯病則用斯藥豈以幼兒純陽不堪辛熱執為定論者哉
